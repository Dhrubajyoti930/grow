<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slime Mold Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; font-family: 'Space Mono', monospace; color: #78ffb0; }
        canvas { display: block; cursor: crosshair; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; pointer-events: none; }
        a { color: #50fa7b; text-decoration: none; font-size: 12px; letter-spacing: 1px; pointer-events: auto; display: block; margin-bottom: 10px; }
        h1 { font-size: 14px; margin: 0; text-transform: uppercase; letter-spacing: 2px; }
        .hint { font-size: 10px; opacity: 0.6; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="ui">
        <a href="../index.html">← /grow</a>
        <h1>Physarum Network</h1>
        <div class="hint">Click to place nutrient deposits</div>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        const agents = [];
        const trailMap = [];
        const FOOD_RADIUS = 5;
        const AGENT_COUNT = 1500;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            for (let i = 0; i < width * height; i++) trailMap[i] = 0;
        }

        class Agent {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 1.5;
            }
            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                if (this.x < 0 || this.x >= width || this.y < 0 || this.y >= height) {
                    this.angle += Math.PI;
                    this.x = Math.max(0, Math.min(width - 1, this.x));
                    this.y = Math.max(0, Math.min(height - 1, this.y));
                }
                const idx = Math.floor(this.x) + Math.floor(this.y) * width;
                trailMap[idx] = Math.min(255, trailMap[idx] + 20);
                this.angle += (Math.random() - 0.5) * 0.2;
            }
        }

        function init() {
            resize();
            for (let i = 0; i < AGENT_COUNT; i++) agents.push(new Agent());
            animate();
        }

        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 12, 0.15)';
            ctx.fillRect(0, 0, width, height);
            
            const imgData = ctx.createImageData(width, height);
            for (let i = 0; i < trailMap.length; i++) {
                trailMap[i] *= 0.95;
                const p = i * 4;
                imgData.data[p] = trailMap[i] * 0.3;
                imgData.data[p+1] = trailMap[i];
                imgData.data[p+2] = trailMap[i] * 0.7;
                imgData.data[p+3] = 255;
            }
            ctx.putImageData(imgData, 0, 0);

            agents.forEach(a => a.update());
            requestAnimationFrame(animate);
        }

        window.addEventListener('mousedown', (e) => {
            const x = e.clientX, y = e.clientY;
            for(let i = -20; i < 20; i++) {
                for(let j = -20; j < 20; j++) {
                    const idx = Math.floor(x + i) + Math.floor(y + j) * width;
                    if(idx > 0 && idx < trailMap.length) trailMap[idx] = 255;
                }
            }
        });

        window.addEventListener('resize', resize);
        init();
    </script>
</body>
</html>
