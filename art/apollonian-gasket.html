<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apollonian Gasket</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #555;
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.3s;
            z-index: 10;
        }
        #back-link:hover { color: #fff; }
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            cursor: crosshair;
        }
        .ui {
            position: absolute;
            bottom: 20px;
            text-align: center;
            pointer-events: none;
            opacity: 0.5;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <a id="back-link" href="../index.html">← /grow</a>
    <canvas id="canvas"></canvas>
    <div class="ui">Apollonian Gasket // Recursive Geometry</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Circle {
            constructor(x, y, r, depth = 0) {
                this.x = x;
                this.y = y;
                this.r = r;
                this.depth = depth;
            }
        }

        function getCurvature(r) { return 1 / r; }

        function drawCircle(c) {
            ctx.beginPath();
            ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
            ctx.strokeStyle = `hsla(${200 + c.depth * 20}, 70%, 60%, ${0.5 + 0.5 / (c.depth + 1)})`;
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // Descartes' Circle Theorem calculation
        function solve(c1, c2, c3) {
            let k1 = 1 / c1.r, k2 = 1 / c2.r, k3 = 1 / c3.r;
            let k4 = k1 + k2 + k3 + 2 * Math.sqrt(k1 * k2 + k2 * k3 + k3 * k1);
            let r4 = 1 / k4;

            let x1 = c1.x, y1 = c1.y, x2 = c2.x, y2 = c2.y, x3 = c3.x, y3 = c3.y;
            
            // Simplified Apollonian coordinates logic
            let a = k1*x1 + k2*x2 + k3*x3;
            let b = k1*y1 + k2*y2 + k3*y3;
            let c = Math.sqrt(k1*k2*(x1-x2)**2 + k2*k3*(x2-x3)**2 + k3*k1*(x3-x1)**2 + k1*k2*(y1-y2)**2 + k2*k3*(y2-y3)**2 + k3*k1*(y3-y1)**2);
            
            return {
                x: (a + 2 * Math.sqrt(k1*k2*k3*k4) * (x1+x2+x3)) / k4, // Simplified approximation
                y: (b + 2 * Math.sqrt(k1*k2*k3*k4) * (y1+y2+y3)) / k4,
                r: r4
            };
        }

        function gasket(c1, c2, c3, depth) {
            if (depth > 6) return;
            let newC = solve(c1, c2, c3);
            if (newC.r < 0.5) return;
            drawCircle(newC);
            gasket(c1, c2, newC, depth + 1);
            gasket(c1, c3, newC, depth + 1);
            gasket(c2, c3, newC, depth + 1);
        }

        function init() {
            ctx.clearRect(0, 0, width, height);
            let r = Math.min(width, height) * 0.4;
            let c1 = {x: width/2, y: height/2 - r/2, r: r/2};
            let c2 = {x: width/2 - r/2, y: height/2 + r/2, r: r/2};
            let c3 = {x: width/2 + r/2, y: height/2 + r/2, r: r/2};
            
            drawCircle(c1); drawCircle(c2); drawCircle(c3);
            gasket(c1, c2, c3, 0);
        }

        init();
    </script>
</body>
</html>
