<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superformula Shapes</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0c; --accent: #00ff9d; --panel: #16161a; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: #e0e0e0; font-family: 'Space Mono', monospace; overflow: hidden; }
        #back-link { position: absolute; top: 20px; left: 20px; color: var(--accent); text-decoration: none; font-size: 12px; z-index: 10; border-bottom: 1px solid transparent; transition: 0.3s; }
        #back-link:hover { border-bottom: 1px solid var(--accent); }
        canvas { display: block; cursor: crosshair; }
        .ui { position: absolute; bottom: 20px; right: 20px; background: var(--panel); padding: 20px; border-radius: 8px; border: 1px solid #333; width: 240px; }
        .slider-group { margin-bottom: 15px; }
        label { display: block; font-size: 10px; text-transform: uppercase; margin-bottom: 5px; color: #888; }
        input { width: 100%; accent-color: var(--accent); }
        h1 { position: absolute; top: 10px; right: 20px; font-size: 14px; letter-spacing: 2px; color: #444; }
    </style>
</head>
<body>

<a id="back-link" href="../index.html">← /grow</a>
<h1>SUPERFORMULA</h1>

<canvas id="canvas"></canvas>

<div class="ui">
    <div class="slider-group"><label>m (symmetry)</label><input type="range" id="m" min="0" max="20" step="1" value="5"></div>
    <div class="slider-group"><label>n1 (exponent)</label><input type="range" id="n1" min="0.1" max="10" step="0.1" value="1"></div>
    <div class="slider-group"><label>n2 (exponent)</label><input type="range" id="n2" min="0.1" max="10" step="0.1" value="1"></div>
    <div class="slider-group"><label>n3 (exponent)</label><input type="range" id="n3" min="0.1" max="10" step="0.1" value="1"></div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const params = { m: 5, n1: 1, n2: 1, n3: 1 };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', (e) => {
            params[e.target.id] = parseFloat(e.target.value);
            draw();
        });
    });

    function superformula(angle, m, n1, n2, n3, a, b) {
        let t1 = Math.abs(Math.cos(m * angle / 4) / a);
        t1 = Math.pow(t1, n2);
        let t2 = Math.abs(Math.sin(m * angle / 4) / b);
        t2 = Math.pow(t2, n3);
        return Math.pow(t1 + t2, -1 / n1);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = Math.min(centerX, centerY) * 0.6;
        const a = 1, b = 1;

        ctx.beginPath();
        ctx.strokeStyle = '#00ff9d';
        ctx.lineWidth = 2;

        for (let i = 0; i <= 360; i++) {
            let angle = (i * Math.PI) / 180;
            let r = superformula(angle, params.m, params.n1, params.n2, params.n3, a, b);
            let x = centerX + r * radius * Math.cos(angle);
            let y = centerY + r * radius * Math.sin(angle);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
        
        ctx.fillStyle = 'rgba(0, 255, 157, 0.1)';
        ctx.fill();
    }

    draw();
</script>
</body>
</html>
