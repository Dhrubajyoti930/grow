<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truchet Pipes</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0c;
            color: #55f;
            font-family: 'Space Mono', monospace;
            overflow: hidden;
        }
        #nav {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }
        #nav a {
            color: #444;
            text-decoration: none;
            font-size: 12px;
            transition: color 0.3s;
        }
        #nav a:hover { color: #fff; }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="nav"><a href="../index.html">← /grow</a></div>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let size = 60;
    let cols, rows;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        cols = Math.ceil(canvas.width / size) + 1;
        rows = Math.ceil(canvas.height / size) + 1;
        draw();
    }

    function draw() {
        ctx.fillStyle = '#0a0a0c';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#222630';
        ctx.lineWidth = size / 4;
        ctx.lineCap = 'round';

        for (let i = 0; i < cols; i++) {
            for (let j = 0; j < rows; j++) {
                const x = i * size;
                const y = j * size;
                const type = Math.random() > 0.5;

                ctx.beginPath();
                if (type) {
                    // Arc 1: top-left corner
                    ctx.arc(x, y, size / 2, 0, Math.PI / 2);
                    ctx.stroke();
                    // Arc 2: bottom-right corner
                    ctx.beginPath();
                    ctx.arc(x + size, y + size, size / 2, Math.PI, 3 * Math.PI / 2);
                    ctx.stroke();
                } else {
                    // Arc 1: top-right corner
                    ctx.arc(x + size, y, size / 2, Math.PI / 2, Math.PI);
                    ctx.stroke();
                    // Arc 2: bottom-left corner
                    ctx.beginPath();
                    ctx.arc(x, y + size, size / 2, 3 * Math.PI / 2, 0);
                    ctx.stroke();
                }
            }
        }
    }

    canvas.addEventListener('click', draw);
    window.addEventListener('resize', resize);
    
    // Initial polish: add a subtle scanline effect via shadow
    ctx.shadowBlur = 4;
    ctx.shadowColor = '#00f';

    resize();
</script>
</body>
</html>
