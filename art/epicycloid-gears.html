<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epicycloid Gears</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --accent: #00f2ff;
            --panel: #16161a;
            --text: #e0e0e0;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg); color: var(--text);
            font-family: 'Space Mono', monospace;
            overflow: hidden;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        #nav {
            position: absolute; top: 20px; left: 20px; z-index: 10;
        }
        a { color: var(--accent); text-decoration: none; font-size: 0.8rem; opacity: 0.7; transition: 0.3s; }
        a:hover { opacity: 1; }
        canvas { cursor: crosshair; touch-action: none; }
        .ui {
            position: absolute; bottom: 30px; display: flex; gap: 20px;
            background: var(--panel); padding: 15px 25px; border-radius: 8px;
            border: 1px solid #333; user-select: none;
        }
        .control { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; }
        input { accent-color: var(--accent); }
    </style>
</head>
<body>

    <div id="nav"><a href="../index.html">← /grow</a></div>

    <canvas id="canvas"></canvas>

    <div class="ui">
        <div class="control">
            <label>R (Fixed)</label>
            <input type="range" id="rR" min="50" max="200" value="120">
        </div>
        <div class="control">
            <label>r (Rolling)</label>
            <input type="range" id="rr" min="10" max="100" value="40">
        </div>
        <div class="control">
            <label>d (Offset)</label>
            <input type="range" id="rd" min="10" max="150" value="60">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const rR = document.getElementById('rR');
        const rr = document.getElementById('rr');
        const rd = document.getElementById('rd');

        let angle = 0;
        let points = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function draw() {
            ctx.fillStyle = '#0a0a0c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const R = parseInt(rR.value);
            const r = parseInt(rr.value);
            const d = parseInt(rd.value);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            angle += 0.02;
            
            // Epicycloid formula
            const x = (R + r) * Math.cos(angle) - d * Math.cos(((R + r) / r) * angle);
            const y = (R + r) * Math.sin(angle) - d * Math.sin(((R + r) / r) * angle);

            points.push({x: cx + x, y: cy + y});
            if (points.length > 500) points.shift();

            // Draw trail
            ctx.beginPath();
            ctx.strokeStyle = '#00f2ff';
            ctx.lineWidth = 2;
            for(let i=0; i<points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.stroke();

            // Draw circles
            ctx.strokeStyle = '#333';
            ctx.beginPath();
            ctx.arc(cx, cy, R, 0, Math.PI * 2);
            ctx.stroke();

            const ox = (R + r) * Math.cos(angle);
            const oy = (R + r) * Math.sin(angle);
            ctx.beginPath();
            ctx.arc(cx + ox, cy + oy, r, 0, Math.PI * 2);
            ctx.stroke();

            requestAnimationFrame(draw);
        }

        rR.oninput = () => points = [];
        rr.oninput = () => points = [];
        rd.oninput = () => points = [];

        draw();
    </script>
</body>
</html>
