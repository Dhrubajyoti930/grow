<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilbert Curve Fill</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0c; --text: #e0e0e0; --accent: #00f2ff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Space Mono', monospace; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #back-link { position: absolute; top: 20px; left: 20px; color: var(--accent); text-decoration: none; font-size: 12px; letter-spacing: 1px; opacity: 0.7; }
        #back-link:hover { opacity: 1; }
        canvas { max-width: 90vmin; max-height: 90vmin; border: 1px solid #222; cursor: pointer; }
        .controls { position: absolute; bottom: 30px; text-align: center; font-size: 10px; pointer-events: none; opacity: 0.5; }
    </style>
</head>
<body>
    <a href="../index.html" id="back-link">← /grow</a>
    <canvas id="canvas"></canvas>
    <div class="controls">TAP TO INCREASE ORDER</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let order = 1;
        const size = 512;
        canvas.width = size;
        canvas.height = size;

        function hilbert(n) {
            const points = [];
            for (let i = 0; i < n * n; i++) {
                points.push(d2xy(n, i));
            }
            return points;
        }

        function d2xy(n, d) {
            let t = d;
            let x = 0, y = 0;
            for (let s = 1; s < n; s *= 2) {
                let rx = 1 & (t / 2);
                let ry = 1 & (t ^ rx);
                if (ry == 0) {
                    if (rx == 1) { x = s - 1 - x; y = s - 1 - y; }
                    [x, y] = [y, x];
                }
                x += s * rx; y += s * ry;
                t /= 4;
            }
            return { x, y };
        }

        function draw() {
            ctx.clearRect(0, 0, size, size);
            const n = Math.pow(2, order);
            const points = hilbert(n);
            const w = size / n;

            ctx.beginPath();
            ctx.strokeStyle = '#00f2ff';
            ctx.lineWidth = Math.max(1, 4 / order);
            
            for (let i = 0; i < points.length; i++) {
                const x = points[i].x * w + w / 2;
                const y = points[i].y * w + w / 2;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        canvas.addEventListener('click', () => {
            order = (order % 6) + 1;
            draw();
        });

        draw();
    </script>
</body>
</html>
