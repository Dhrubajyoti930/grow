<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cymatic Water</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; font-family: 'Space Mono', monospace; }
        #canvas { width: 100%; height: 100%; display: block; }
        .ui { position: absolute; top: 20px; left: 20px; z-index: 10; }
        a { color: #555; text-decoration: none; font-size: 12px; transition: 0.3s; }
        a:hover { color: #fff; }
        #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); cursor: pointer; color: #fff; text-transform: uppercase; letter-spacing: 2px; z-index: 5; }
    </style>
</head>
<body>

    <div class="ui"><a href="../index.html">← /grow</a></div>
    <div id="overlay">Click to Initiate Resonance</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        
        let audioCtx, analyser, dataArray;
        let particles = [];
        const resolution = 40;

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            const spacing = canvas.width / resolution;
            for(let x = 0; x <= resolution; x++) {
                for(let y = 0; y <= resolution; y++) {
                    particles.push({ x: x * spacing, y: y * (canvas.height/resolution), ox: x * spacing, oy: y * (canvas.height/resolution) });
                }
            }
        }

        async function setupAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const source = audioCtx.createMediaStreamSource(stream);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            overlay.style.display = 'none';
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            analyser.getByteFrequencyData(dataArray);
            let bass = dataArray[2] / 255;
            
            ctx.fillStyle = '#0a0a0c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#2a5a7a';
            ctx.beginPath();
            particles.forEach((p, i) => {
                let dist = Math.sin(p.x * 0.01 + bass * 10) * (bass * 50);
                let x = p.x + Math.cos(p.y * 0.05 + bass * 5) * (bass * 20);
                let y = p.y + dist;
                
                if (i % (resolution + 1) !== 0) ctx.lineTo(x, y);
                else ctx.moveTo(x, y);
            });
            ctx.stroke();
        }

        overlay.addEventListener('click', () => {
            setupAudio().catch(e => alert("Mic access required for cymatic visualization"));
        });

        window.addEventListener('resize', init);
        init();
    </script>
</body>
</html>
