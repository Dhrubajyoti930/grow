<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectral Flow</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; font-family: 'Space Mono', monospace; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; }
        a { color: #555; text-decoration: none; font-size: 12px; transition: color 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        a:hover { color: #fff; }
        #label { position: absolute; bottom: 20px; right: 20px; color: #333; font-size: 10px; pointer-events: none; }
    </style>
</head>
<body>

<div id="ui">
    <a href="../index.html">← /grow</a>
</div>
<div id="label">SPECTRAL_FLOW_V1.0</div>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height, field;
    const resolution = 20;
    const particles = [];
    const particleCount = 800;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }

    class Particle {
        constructor() { this.init(); }
        init() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = 0;
            this.vy = 0;
            this.life = Math.random() * 200 + 100;
        }
        update() {
            let gx = Math.floor(this.x / resolution);
            let gy = Math.floor(this.y / resolution);
            let index = gx + gy * Math.ceil(width / resolution);
            if (field[index]) {
                this.vx += field[index].x * 0.1;
                this.vy += field[index].y * 0.1;
            }
            this.x += this.vx;
            this.y += this.vy;
            this.vx *= 0.95;
            this.vy *= 0.95;
            this.life--;
            if (this.life < 0 || this.x < 0 || this.x > width || this.y < 0 || this.y > height) this.init();
        }
        draw() {
            const speed = Math.sqrt(this.vx**2 + this.vy**2);
            const hue = (speed * 40 + Date.now() / 50) % 360;
            ctx.fillStyle = `hsla(${hue}, 80%, 60%, 0.8)`;
            ctx.fillRect(this.x, this.y, 1.5, 1.5);
        }
    }

    function generateField() {
        field = [];
        const cols = Math.ceil(width / resolution);
        const rows = Math.ceil(height / resolution);
        for (let i = 0; i < cols * rows; i++) {
            const angle = (Math.sin(i * 0.05) + Math.cos(i * 0.02)) * Math.PI * 2;
            field.push({ x: Math.cos(angle), y: Math.sin(angle) });
        }
    }

    function animate() {
        ctx.fillStyle = 'rgba(10, 10, 12, 0.05)';
        ctx.fillRect(0, 0, width, height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => { resize(); generateField(); });
    resize();
    generateField();
    for (let i = 0; i < particleCount; i++) particles.push(new Particle());
    animate();
</script>
</body>
</html>
