<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raymarched Spheres</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050505; font-family: 'Space Mono', monospace; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; }
        a { color: #888; text-decoration: none; font-size: 12px; letter-spacing: 1px; transition: color 0.3s; }
        a:hover { color: #fff; }
    </style>
</head>
<body>

    <div id="ui">
        <a href="../index.html">← /grow</a>
    </div>

    <canvas id="glCanvas"></canvas>

    <script id="fs" type="x-shader/x-fragment">
        precision highp float;
        uniform vec2 u_res;
        uniform float u_time;

        #define MAX_STEPS 64
        #define MAX_DIST 20.0
        #define SURF_DIST 0.001

        mat2 Rot(float a) {
            float s = sin(a), c = cos(a);
            return mat2(c, -s, s, c);
        }

        float sdSphere(vec3 p, float s) {
            return length(p) - s;
        }

        float map(vec3 p) {
            p.xz *= Rot(u_time * 0.2);
            p.xy *= Rot(u_time * 0.1);
            
            vec3 q = mod(p + 2.0, 4.0) - 2.0;
            return sdSphere(q, 0.8 + 0.2 * sin(u_time));
        }

        vec3 getNormal(vec3 p) {
            vec2 e = vec2(0.01, 0);
            return normalize(map(p) - vec3(map(p-e.xyy), map(p-e.yxy), map(p-e.yyx)));
        }

        void main() {
            vec2 uv = (gl_FragCoord.xy - 0.5 * u_res.xy) / u_res.y;
            vec3 ro = vec3(0, 0, -5.0 + sin(u_time * 0.3) * 2.0);
            vec3 rd = normalize(vec3(uv, 1.0));
            
            float dO = 0.0;
            vec3 p;
            
            for(int i=0; i<MAX_STEPS; i++) {
                p = ro + rd * dO;
                float dS = map(p);
                dO += dS;
                if(dO > MAX_DIST || abs(dS) < SURF_DIST) break;
            }
            
            vec3 col = vec3(0.02);
            if(dO < MAX_DIST) {
                vec3 n = getNormal(p);
                vec3 r = reflect(rd, n);
                float diff = dot(n, normalize(vec3(1,2,3))) * 0.5 + 0.5;
                col = vec3(diff) * vec3(0.1, 0.5, 0.8) + (r * 0.5 + 0.5) * 0.3;
                col += pow(max(0.0, dot(reflect(normalize(vec3(1,1,-1)), n), rd)), 50.0);
            }
            
            gl_FragColor = vec4(col, 1.0);
        }
    </script>

    <script id="vs" type="x-shader/x-vertex">
        attribute vec2 position;
        void main() { gl_Position = vec4(position, 0.0, 1.0); }
    </script>

    <script>
        const canvas = document.getElementById('glCanvas');
        const gl = canvas.getContext('webgl');
        const program = gl.createProgram();

        function createShader(gl, type, source) {
            const s = gl.createShader(type);
            gl.shaderSource(s, source);
            gl.compileShader(s);
            return s;
        }

        gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, document.getElementById('vs').text));
        gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, document.getElementById('fs').text));
        gl.linkProgram(program);
        gl.useProgram(program);

        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
        
        const pos = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(pos);
        gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

        const resLoc = gl.getUniformLocation(program, 'u_res');
        const timeLoc = gl.getUniformLocation(program, 'u_time');

        function render(time) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.uniform2f(resLoc, canvas.width, canvas.height);
            gl.uniform1f(timeLoc, time * 0.001);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);
    </script>
</body>
</html>
