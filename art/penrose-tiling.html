<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penrose Tiling</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            color: #d1d1d1;
            font-family: 'Space Mono', monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #nav {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }
        #nav a {
            color: #666;
            text-decoration: none;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s;
        }
        #nav a:hover { color: #fff; }
        canvas {
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }
        .ui {
            position: absolute;
            bottom: 30px;
            right: 30px;
            text-align: right;
            pointer-events: none;
        }
        h1 { font-size: 18px; margin: 0; letter-spacing: 4px; color: #444; }
    </style>
</head>
<body>

<div id="nav"><a href="../index.html">← /grow</a></div>

<div class="ui">
    <h1>PENROSE</h1>
    <p style="font-size: 10px; opacity: 0.5;">CLICK TO REGENERATE</p>
</div>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const PHI = (1 + Math.sqrt(5)) / 2;

    let width, height;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        draw();
    }

    // Using a subdivision method for Penrose P2 (Kites and Darts)
    class Tile {
        constructor(type, a, b, c) {
            this.type = type; // 0 for Kite, 1 for Dart
            this.a = a; this.b = b; this.c = c;
        }
    }

    let tiles = [];

    function init() {
        tiles = [];
        const radius = Math.min(width, height) * 0.8;
        const center = { x: width/2, y: height/2 };
        
        // Initial decagon
        for(let i=0; i<10; i++) {
            const a = i * Math.PI / 5;
            const b = (i + 1) * Math.PI / 5;
            tiles.push(new Tile(0, center, {x: center.x + radius*Math.cos(a), y: center.y + radius*Math.sin(a)}, {x: center.x + radius*Math.cos(b), y: center.y + radius*Math.sin(b)}));
        }
        
        for(let i=0; i<5; i++) subdivide();
        for(let i=0; i<3; i++) subdivide();
    }

    function subdivide() {
        let next = [];
        tiles.forEach(t => {
            if(t.type === 0) { // Kite
                const p = {x: t.a.x + (t.b.x - t.a.x)/PHI, y: t.a.y + (t.b.y - t.a.y)/PHI};
                next.push(new Tile(1, t.c, p, t.b));
                next.push(new Tile(0, p, t.c, t.a));
            } else { // Dart
                const q = {x: t.a.x + (t.b.x - t.a.x)/PHI, y: t.a.y + (t.b.y - t.a.y)/PHI};
                const r = {x: t.a.x + (t.c.x - t.a.x)/PHI, y: t.a.y + (t.c.y - t.a.y)/PHI};
                next.push(new Tile(0, r, t.c, q));
                next.push(new Tile(1, r, q, t.a));
                next.push(new Tile(1, q, t.b, t.c));
            }
        });
        tiles = next;
    }

    function draw() {
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, width, height);
        
        tiles.forEach((t, i) => {
            ctx.beginPath();
            ctx.moveTo(t.a.x, t.a.y);
            ctx.lineTo(t.b.x, t.b.y);
            ctx.lineTo(t.c.x, t.c.y);
            ctx.closePath();
            
            ctx.fillStyle = t.type === 0 ? '#1a1a1a' : '#0f0f0f';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 0.5;
            ctx.stroke();
        });
    }

    window.addEventListener('resize', resize);
    window.addEventListener('click', () => { init(); draw(); });
    
    resize();
</script>

</body>
</html>
