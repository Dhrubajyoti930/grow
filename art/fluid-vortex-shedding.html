<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Vortex Shedding</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; color: #e0e0e0; font-family: 'Space Mono', monospace; }
        canvas { display: block; cursor: crosshair; }
        .ui { position: absolute; top: 20px; left: 20px; z-index: 10; pointer-events: none; }
        a { color: #555; text-decoration: none; font-size: 12px; transition: color 0.3s; pointer-events: auto; display: block; margin-bottom: 10px; }
        a:hover { color: #fff; }
        h1 { font-size: 18px; letter-spacing: 2px; margin: 0; text-transform: uppercase; color: #4af; text-shadow: 0 0 10px rgba(68, 170, 255, 0.3); }
        .instructions { font-size: 10px; opacity: 0.6; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="ui">
        <a href="../index.html">← /grow</a>
        <h1>Fluid Vortex</h1>
        <div class="instructions">DRAG TO MOVE OBSTACLE</div>
    </div>
    <canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height, field, particles;
    const res = 20;
    const cols = 40, rows = 30;
    let obstacle = { x: 200, y: 300, r: 25 };

    function init() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        field = [];
        for (let i = 0; i < cols; i++) {
            field[i] = [];
            for (let j = 0; j < rows; j++) field[i][j] = { x: 1, y: 0 };
        }
        particles = Array.from({ length: 400 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            life: Math.random() * 100
        }));
    }

    function update() {
        for (let i = 0; i < cols; i++) {
            for (let j = 0; j < rows; j++) {
                let px = i * (width / cols), py = j * (height / rows);
                let dx = px - obstacle.x, dy = py - obstacle.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < obstacle.r * 2) {
                    field[i][j].x = dx / dist;
                    field[i][j].y = dy / dist;
                } else {
                    field[i][j].x = 1;
                    field[i][j].y = Math.sin(i * 0.2 + Date.now() * 0.005) * 0.2;
                }
            }
        }
    }

    function draw() {
        ctx.fillStyle = 'rgba(10, 10, 12, 0.15)';
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = '#4af';
        particles.forEach(p => {
            let col = Math.floor(p.x / (width / cols));
            let row = Math.floor(p.y / (height / rows));
            if (col >= 0 && col < cols && row >= 0 && row < rows) {
                let f = field[col][row];
                p.x += f.x * 3;
                p.y += f.y * 3;
            }
            p.x = (p.x + width) % width;
            p.y = (p.y + height) % height;
            ctx.fillRect(p.x, p.y, 1.5, 1.5);
        });
        ctx.beginPath();
        ctx.arc(obstacle.x, obstacle.y, obstacle.r, 0, Math.PI * 2);
        ctx.fillStyle = '#222';
        ctx.fill();
        ctx.strokeStyle = '#4af';
        ctx.stroke();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    window.onmousemove = (e) => { obstacle.x = e.clientX; obstacle.y = e.clientY; };
    window.onresize = init;
    init();
    loop();
</script>
</body>
</html>
