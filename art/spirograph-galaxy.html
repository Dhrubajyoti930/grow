<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spirograph Galaxy</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050505; color: #fff; font-family: 'Space Mono', monospace; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 10; }
        a { color: #555; text-decoration: none; font-size: 12px; pointer-events: auto; transition: color 0.3s; }
        a:hover { color: #fff; }
        .controls { position: absolute; bottom: 20px; right: 20px; color: #333; font-size: 10px; text-align: right; }
    </style>
</head>
<body>

    <div id="ui">
        <a href="../index.html">← /grow</a>
    </div>

    <div class="controls">
        SPIROGRAPH GALAXY<br>
        ORBITAL SYNC ACTIVE
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height, time = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        function drawHypotrochoid(x, y, R, r, d, color, rotation) {
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 0.8;
            for (let t = 0; t <= Math.PI * 2; t += 0.05) {
                let px = (R - r) * Math.cos(t) + d * Math.cos(((R - r) / r) * t + rotation);
                let py = (R - r) * Math.sin(t) - d * Math.sin(((R - r) / r) * t + rotation);
                if (t === 0) ctx.moveTo(x + px, y + py);
                else ctx.lineTo(x + px, y + py);
            }
            ctx.stroke();
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.15)';
            ctx.fillRect(0, 0, width, height);

            const centerX = width / 2;
            const centerY = height / 2;
            const orbitRadius = 150;
            time += 0.01;

            for (let i = 0; i < 5; i++) {
                const angle = time + (i * (Math.PI * 2 / 5));
                const x = centerX + Math.cos(angle) * orbitRadius;
                const y = centerY + Math.sin(angle) * orbitRadius;
                
                const hue = (i * 40 + time * 20) % 360;
                drawHypotrochoid(
                    x, y, 
                    60 + Math.sin(time) * 10, 
                    20 + Math.cos(time * 0.5) * 5, 
                    30, 
                    `hsla(${hue}, 70%, 60%, 0.8)`,
                    time * 0.5
                );
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
