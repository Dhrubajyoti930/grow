<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Superposition</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0c;
            color: #e0e0e0;
            font-family: 'Space Mono', monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #555;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 1px;
            transition: color 0.3s;
            z-index: 10;
        }
        #back-link:hover { color: #fff; }
        canvas {
            cursor: crosshair;
            filter: drop-shadow(0 0 10px rgba(0, 255, 200, 0.2));
        }
        .ui {
            position: absolute;
            bottom: 30px;
            text-align: center;
            pointer-events: none;
            user-select: none;
        }
        h1 { font-size: 14px; font-weight: 400; letter-spacing: 4px; color: #444; }
    </style>
</head>
<body>

    <a id="back-link" href="../index.html">← /grow</a>
    
    <div class="ui">
        <h1>[ CLICK TO COLLAPSE WAVEFUNCTION ]</h1>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];
        let state = 0; // 0: hazy, 1: orbital

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.targetX = width/2 + (Math.random() - 0.5) * 200;
                this.targetY = height/2 + (Math.random() - 0.5) * 200;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.size = Math.random() * 2 + 1;
            }
            update() {
                if (state === 0) {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                } else {
                    this.x += (this.targetX - this.x) * 0.05;
                    this.y += (this.targetY - this.y) * 0.05;
                }
            }
            draw() {
                ctx.fillStyle = state === 0 ? '#444' : '#00ffd0';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 400; i++) particles.push(new Particle());

        function animate() {
            ctx.fillStyle = '#0a0a0c';
            ctx.fillRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('mousedown', () => {
            state = state === 0 ? 1 : 0;
            if (state === 1) {
                particles.forEach(p => {
                    let angle = Math.random() * Math.PI * 2;
                    let radius = 50 + Math.random() * 100;
                    p.targetX = width/2 + Math.cos(angle) * radius;
                    p.targetY = height/2 + Math.sin(angle) * radius;
                });
            }
        });

        animate();
    </script>
</body>
</html>
