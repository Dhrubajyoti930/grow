<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetic Field Lines</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            color: #d1d1d1;
            font-family: 'Space Mono', monospace;
        }
        #back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            text-decoration: none;
            color: #666;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }
        #back-link:hover { color: #fff; }
        canvas { display: block; cursor: crosshair; }
        #ui {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            pointer-events: none;
            font-size: 0.7rem;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <a href="../index.html" id="back-link">← /grow</a>
    <canvas id="canvas"></canvas>
    <div id="ui">TOUCH TO DISTURB THE FIELD</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        const mouse = { x: -1000, y: -1000 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.init();
            }
            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.angle = 0;
                this.speed = Math.random() * 2 + 0.5;
            }
            update(m1, m2) {
                const dx1 = this.x - m1.x;
                const dy1 = this.y - m1.y;
                const dx2 = this.x - m2.x;
                const dy2 = this.y - m2.y;
                
                const d1 = Math.sqrt(dx1 * dx1 + dy1 * dy1);
                const d2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);

                const force1 = 1000 / (d1 * d1 + 1000);
                const force2 = 1000 / (d2 * d2 + 1000);

                // Magnetic cross-field logic
                this.angle = Math.atan2(dy1, dx1) - Math.atan2(dy2, dx2) + Math.PI / 2;
                
                this.x += Math.cos(this.angle) * (force1 - force2) * 20;
                this.y += Math.sin(this.angle) * (force1 - force2) * 20;

                if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) this.init();
            }
            draw() {
                ctx.fillStyle = '#444';
                ctx.fillRect(this.x, this.y, 1.5, 1.5);
            }
        }

        for (let i = 0; i < 1500; i++) particles.push(new Particle());

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.15)';
            ctx.fillRect(0, 0, width, height);

            const time = Date.now() * 0.001;
            const m1 = { 
                x: width/2 + Math.cos(time) * 150, 
                y: height/2 + Math.sin(time) * 150 
            };
            const m2 = { 
                x: mouse.x > 0 ? mouse.x : width/2 + Math.cos(time + Math.PI) * 150, 
                y: mouse.y > 0 ? mouse.y : height/2 + Math.sin(time + Math.PI) * 150 
            };

            particles.forEach(p => {
                p.update(m1, m2);
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('touchstart', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });
        window.addEventListener('touchmove', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });

        animate();
    </script>
</body>
</html>
