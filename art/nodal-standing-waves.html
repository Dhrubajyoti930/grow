<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nodal Standing Waves</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0c;
            color: #e0e0e0;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }
        a {
            color: #666;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 1px;
            transition: color 0.3s;
        }
        a:hover { color: #fff; }
        canvas {
            image-rendering: pixelated;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }
        .controls {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 20px;
            background: rgba(255,255,255,0.03);
            padding: 15px 25px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }
        .control-group { display: flex; align-items: center; gap: 10px; }
        input[type=range] { accent-color: #444; }
    </style>
</head>
<body>

    <div id="ui">
        <a href="../index.html">← /grow</a>
    </div>

    <canvas id="canvas"></canvas>

    <div class="controls">
        <div class="control-group">
            <span style="font-size: 10px;">X</span>
            <input type="range" id="nx" min="1" max="8" value="2" step="1">
        </div>
        <div class="control-group">
            <span style="font-size: 10px;">Y</span>
            <input type="range" id="ny" min="1" max="8" value="3" step="1">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const nxInput = document.getElementById('nx');
        const nyInput = document.getElementById('ny');

        let width, height, time = 0;
        const res = 100;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        function draw() {
            ctx.fillStyle = '#0a0a0c';
            ctx.fillRect(0, 0, width, height);

            const nx = parseInt(nxInput.value);
            const ny = parseInt(nyInput.value);
            
            const cellW = width / res;
            const cellH = height / res;
            time += 0.05;

            for (let i = 0; i <= res; i++) {
                for (let j = 0; j <= res; j++) {
                    const x = i / res;
                    const y = j / res;
                    
                    const val = Math.sin(x * nx * Math.PI) * Math.sin(y * ny * Math.PI) * Math.sin(time);
                    
                    const hue = val > 0 ? 200 : 340;
                    const alpha = Math.abs(val) * 0.8;
                    
                    ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${alpha})`;
                    ctx.fillRect(i * cellW, j * cellH, cellW * 0.8, cellH * 0.8);
                }
            }
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
