<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bismuth Staircase</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --accent: #5effce;
            --metal: #2d3436;
            --text: #dcdde1;
        }
        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }
        #nav { width: 100%; margin-bottom: 2rem; }
        #nav a { color: var(--accent); text-decoration: none; font-size: 0.9rem; letter-spacing: 2px; }
        .container { max-width: 600px; text-align: center; }
        h1 { font-family: 'Playfair Display', serif; color: var(--accent); font-style: italic; }
        #stove-area {
            width: 200px; height: 200px;
            border: 4px solid #333;
            border-radius: 50%;
            margin: 40px auto;
            position: relative;
            background: radial-gradient(circle, #1a1a1a 0%, #000 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s;
        }
        #stove-area:active { transform: scale(0.95); }
        #bismuth-chunk {
            width: 80px; height: 80px;
            background: #4a4a4a;
            border-radius: 4px;
            transition: all 0.5s ease;
        }
        .melted { background: #ff9f43 !important; border-radius: 50% !important; box-shadow: 0 0 20px #ff9f43; }
        .crystal {
            background: linear-gradient(45deg, #00d2d3, #5f27cd, #ff9ff3) !important;
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
            animation: grow 2s ease-out forwards;
        }
        @keyframes grow { from { transform: scale(0); } to { transform: scale(1.5); } }
        #status { margin-top: 20px; font-weight: 300; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="nav"><a href="../index.html">← /grow</a></div>

    <div class="container">
        <h1>The Bismuth Staircase</h1>
        <p>The burner hums. The gray, heavy hunk sits in the ladle. It waits for the heat to translate it into something geometric, something iridescent.</p>
        
        <div id="stove-area" onclick="progress()">
            <div id="bismuth-chunk"></div>
        </div>

        <div id="status">Click the burner to ignite the heat.</div>
    </div>

    <script>
        let stage = 0;
        const chunk = document.getElementById('bismuth-chunk');
        const status = document.getElementById('status');

        function progress() {
            if (stage === 0) {
                chunk.classList.add('melted');
                status.innerText = "The metal yields. Liquid silver ripples in the ladle.";
                stage++;
            } else if (stage === 1) {
                status.innerText = "Slowly lowering the temperature. Watching for the first jagged edge...";
                setTimeout(() => {
                    chunk.classList.remove('melted');
                    chunk.classList.add('crystal');
                    status.innerText = "A hopper crystal forms—a staircase to nowhere, iridescent and cold.";
                    stage++;
                }, 1500);
            } else {
                chunk.style.transform = "scale(1)";
                chunk.className = "";
                status.innerText = "The staircase is finished. The process begins anew.";
                stage = 0;
            }
        }
    </script>
</body>
</html>
