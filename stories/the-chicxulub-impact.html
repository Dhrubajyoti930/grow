<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Chicxulub Impact</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --text: #d1d1d6;
            --accent: #ff4d00;
            --dim: #555;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            line-height: 1.6;
        }
        #container {
            max-width: 600px;
            padding: 40px 20px;
            width: 100%;
        }
        .nav {
            font-family: 'Courier Prime', monospace;
            font-size: 0.8rem;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .nav a { color: var(--dim); text-decoration: none; transition: 0.3s; }
        .nav a:hover { color: var(--accent); }
        h1 {
            font-family: 'Courier Prime', monospace;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            color: #fff;
            border-left: 4px solid var(--accent);
            padding-left: 20px;
        }
        #story { font-size: 1.1rem; min-height: 200px; }
        .pixel-art {
            image-rendering: pixelated;
            width: 100%;
            height: 150px;
            background: #111;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #222;
        }
        button {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Courier Prime', monospace;
            margin-top: 20px;
            transition: 0.3s;
        }
        button:hover { background: var(--accent); color: #000; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="container">
    <div class="nav"><a href="../index.html">← /grow</a></div>
    
    <div id="pixel-box" class="pixel-art">
        <canvas id="canvas" width="200" height="100"></canvas>
    </div>

    <div id="story">
        <p id="text">The Yucután sky is unnaturally still. It is a Tuesday, 66 million years ago. A 10-kilometer wide mountain of rock, hidden by the glare of the sun, screams toward the atmosphere at 45,000 miles per hour.</p>
    </div>
    
    <button id="nextBtn">Trace the trajectory →</button>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const textEl = document.getElementById('text');
    const btn = document.getElementById('nextBtn');
    let step = 0;

    const stages = [
        {
            text: "Impact. A blinding white light consumes the horizon. The energy released is equivalent to 10 billion Hiroshima bombs. The seafloor vaporizes instantly.",
            draw: () => {
                ctx.fillStyle = "#ff4d00"; ctx.fillRect(80, 20, 40, 40);
                ctx.fillStyle = "#fff"; ctx.fillRect(90, 30, 20, 20);
            }
        },
        {
            text: "Seconds later, the shockwave expands. The sky turns to liquid fire. For the creatures within a thousand miles, the end is not painful—it is instantaneous.",
            draw: () => {
                ctx.fillStyle = "#333"; ctx.fillRect(0, 0, 200, 100);
                ctx.fillStyle = "#ff4d00"; ctx.beginPath(); ctx.arc(100, 50, 40, 0, Math.PI*2); ctx.fill();
            }
        },
        {
            text: "The hour concludes. A global curtain of ejecta begins to fall, igniting the atmosphere. The world of the dinosaurs has ended, and a new, colder age begins.",
            draw: () => {
                ctx.fillStyle = "#111"; ctx.fillRect(0,0,200,100);
                for(let i=0; i<20; i++) {
                    ctx.fillStyle = "#fff";
                    ctx.fillRect(Math.random()*200, Math.random()*100, 2, 2);
                }
            }
        }
    ];

    btn.addEventListener('click', () => {
        if (step < stages.length) {
            ctx.clearRect(0,0,200,100);
            stages[step].draw();
            textEl.innerText = stages[step].text;
            step++;
            if(step === stages.length) btn.style.display = 'none';
        }
    });

    // Initial draw
    ctx.fillStyle = "#555";
    ctx.fillRect(100, 0, 2, 20);
</script>
</body>
</html>
