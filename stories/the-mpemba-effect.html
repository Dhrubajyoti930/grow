<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Mpemba Effect</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;600&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --text: #e0e0e0;
            --accent: #64ffda;
            --ice: #a8dadc;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            width: 100%;
        }
        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            margin-top: 60px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            color: var(--ice);
        }
        .story { margin: 2rem 0; font-size: 1.1rem; }
        .interactive-box {
            background: #15151a;
            border: 1px solid #222;
            padding: 2rem;
            text-align: center;
            border-radius: 8px;
        }
        .btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            margin: 10px;
        }
        .btn:hover { background: var(--accent); color: var(--bg); }
        #display { font-size: 1.5rem; margin: 20px 0; font-weight: bold; }
        .pixel-art {
            image-rendering: pixelated;
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            display: block;
        }
    </style>
</head>
<body>

<a href="../index.html" class="back-link">← /grow</a>

<div class="container">
    <h1>Mpemba Effect</h1>
    <div class="story">
        <p>In 1963, Erasto Mpemba noticed something impossible while making ice cream: the hot mix froze faster than the cold. Science calls this a paradox. Nature calls it a rule.</p>
        <p>Test the anomaly yourself:</p>
    </div>

    <div class="interactive-box">
        <canvas id="iceCanvas" class="pixel-art" width="64" height="64"></canvas>
        <div id="display">Select a temperature to freeze</div>
        <button class="btn" onclick="freeze(10)">Cold Water (10°C)</button>
        <button class="btn" onclick="freeze(90)">Hot Water (90°C)</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('iceCanvas');
    const ctx = canvas.getContext('2d');

    function draw(color) {
        ctx.fillStyle = color;
        ctx.fillRect(16, 16, 32, 32);
    }

    function freeze(temp) {
        const display = document.getElementById('display');
        display.innerText = "Freezing...";
        
        // Mpemba Logic: Hotter water takes shorter time to reach state change
        const time = temp === 90 ? 1500 : 3000;
        
        draw('#444');
        
        setTimeout(() => {
            draw('#a8dadc');
            display.innerText = temp === 90 ? 
                "Success! The hot water crystallized first." : 
                "Slow... the cold water took longer to freeze.";
        }, time);
    }

    draw('#333');
</script>

</body>
</html>
