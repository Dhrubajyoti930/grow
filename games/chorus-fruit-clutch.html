<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chorus Fruit Clutch</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0c; --accent: #b062ff; --void: #1a0f2e; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: #fff; font-family: 'Press Start 2P', cursive; overflow: hidden; touch-action: none; }
        #back-link { position: absolute; top: 20px; left: 20px; color: #555; text-decoration: none; font-size: 10px; z-index: 10; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { border: 2px solid #222; background: #000; box-shadow: 0 0 20px rgba(176, 98, 255, 0.1); max-width: 100%; max-height: 100%; }
        #ui { position: absolute; top: 20px; text-align: center; pointer-events: none; }
    </style>
</head>
<body>
    <a id="back-link" href="../index.html">← /grow</a>
    <div id="ui">
        <div id="score">SCORE: 0</div>
        <div id="msg" style="font-size: 8px; margin-top: 10px; color: var(--accent);">TAP TO TELEPORT</div>
    </div>
    <div id="game-container">
        <canvas id="game"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        canvas.width = 400; canvas.height = 400;

        let score = 0;
        let player = { x: 200, y: 350, size: 20 };
        let projectiles = [];
        let particles = [];
        let gameRunning = true;

        function spawnProjectile() {
            if (!gameRunning) return;
            projectiles.push({
                x: Math.random() * 400,
                y: -20,
                speed: 2 + (score / 5)
            });
            setTimeout(spawnProjectile, Math.max(200, 1000 - score * 20));
        }

        function triggerTeleport() {
            player.x = Math.random() * (canvas.width - 20);
            player.y = Math.random() * (canvas.height - 20);
            for(let i=0; i<10; i++) particles.push({x: player.x, y: player.y, dx: (Math.random()-0.5)*10, dy: (Math.random()-0.5)*10, alpha: 1});
        }

        window.addEventListener('mousedown', triggerTeleport);
        window.addEventListener('touchstart', (e) => { e.preventDefault(); triggerTeleport(); });

        function update() {
            if (!gameRunning) return;
            projectiles.forEach((p, i) => {
                p.y += p.speed;
                if (p.y > canvas.height) { projectiles.splice(i, 1); score++; scoreEl.innerText = 'SCORE: ' + score; }
                if (Math.abs(p.x - player.x) < 20 && Math.abs(p.y - player.y) < 20) gameRunning = false;
            });
            particles.forEach((p, i) => {
                p.x += p.dx; p.y += p.dy; p.alpha -= 0.05;
                if (p.alpha <= 0) particles.splice(i, 1);
            });
        }

        function draw() {
            ctx.fillStyle = '#000'; ctx.fillRect(0,0,400,400);
            
            // Draw Player
            ctx.fillStyle = '#b062ff';
            ctx.fillRect(player.x, player.y, 20, 20);
            
            // Draw Projectiles
            ctx.fillStyle = '#ff3e3e';
            projectiles.forEach(p => ctx.fillRect(p.x, p.y, 10, 10));
            
            // Particles
            particles.forEach(p => {
                ctx.fillStyle = `rgba(176, 98, 255, ${p.alpha})`;
                ctx.fillRect(p.x, p.y, 5, 5);
            });

            if (!gameRunning) {
                ctx.fillStyle = '#fff';
                ctx.fillText('GAME OVER', 140, 200);
                ctx.font = '8px Arial';
                ctx.fillText('CLICK TO RESTART', 130, 230);
            }
            requestAnimationFrame(() => { update(); draw(); });
        }

        canvas.addEventListener('click', () => { if (!gameRunning) location.reload(); });
        spawnProjectile();
        draw();
    </script>
</body>
</html>
