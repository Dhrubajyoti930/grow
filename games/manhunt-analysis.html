<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manhunt Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --accent: #00ff9d;
            --panel: #16161a;
            --text: #e1e1e6;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 2rem;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        a { color: var(--accent); text-decoration: none; font-size: 0.9rem; letter-spacing: 1px; }

        .container {
            width: 90%;
            max-width: 800px;
            background: var(--panel);
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid #2d2d35;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .viewport {
            width: 100%;
            height: 300px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 2rem;
            border: 2px solid #333;
        }

        .pixel-art {
            image-rendering: pixelated;
            width: 64px;
            height: 64px;
            background: var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.7; } }

        .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

        button {
            background: #25252b;
            border: 1px solid #444;
            color: white;
            padding: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background: var(--accent); color: black; }

        .status {
            margin-top: 1.5rem;
            text-align: center;
            font-weight: 600;
            color: var(--accent);
        }

        h1 { margin: 0; font-size: 1.5rem; letter-spacing: -1px; }
    </style>
</head>
<body>

<header>
    <a href="../index.html">← /grow</a>
</header>

<div class="container">
    <h1>Manhunt Analysis</h1>
    <p style="font-size: 0.8rem; opacity: 0.7;">REPLAY ENGINE v2.0 // ANALYZING SCRIPTED BEHAVIORS</p>
    
    <div class="viewport" id="viewport">
        <div class="pixel-art"></div>
    </div>

    <div class="controls">
        <button onclick="analyze('REWIND')">REWIND</button>
        <button onclick="analyze('PAUSE')">PAUSE</button>
        <button onclick="analyze('VERDICT')">VERDICT</button>
    </div>

    <div class="status" id="status">READY FOR ANALYSIS</div>
</div>

<script>
    function analyze(action) {
        const status = document.getElementById('status');
        const outcomes = [
            "PROBABILITY: 88% SCRIPTED",
            "UNUSUAL VELOCITY DETECTED",
            "PATHING CALCULATION: FLAWLESS",
            "NO ANOMALIES FOUND",
            "ERROR: DATA CORRUPTED",
            "SITUATIONAL AWARENESS: 0.04ms"
        ];
        
        if (action === 'VERDICT') {
            status.innerText = outcomes[Math.floor(Math.random() * outcomes.length)];
        } else {
            status.innerText = "ACTION: " + action + " IN PROGRESS...";
        }
    }
</script>

</body>
</html>
