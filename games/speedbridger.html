<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speedbridger</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0c;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none;
        }
        #game-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }
        a {
            color: #555;
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.3s;
        }
        a:hover { color: #fff; }
        #canvas {
            image-rendering: pixelated;
            max-width: 100vw;
            max-height: 100vh;
        }
        #hud {
            position: absolute;
            bottom: 40px;
            text-align: center;
            width: 100%;
            pointer-events: none;
        }
        .instruction { font-size: 1.2rem; color: #444; }
        .score { font-size: 3rem; font-weight: 700; }
    </style>
</head>
<body>

    <div id="game-ui">
        <a href="../index.html">← /grow</a>
    </div>

    <div id="hud">
        <div id="score" class="score">0</div>
        <div class="instruction">Hold to maintain angle</div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        canvas.width = 800;
        canvas.height = 600;

        let player = { x: 100, y: 300, angle: 0, speed: 2, score: 0 };
        let bridgeX = 0;
        let isHolding = false;
        let gameOver = false;

        function draw() {
            ctx.fillStyle = '#0a0a0c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Bridge
            ctx.fillStyle = '#1a1a1e';
            ctx.fillRect(0, 400, canvas.width, 200);

            // Draw Player
            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(player.x, player.y, 40, 40);

            // Logic
            if (!gameOver) {
                if (isHolding) {
                    player.angle += 0.05;
                } else {
                    player.angle -= 0.02;
                }
                
                player.x += player.speed;
                player.y += Math.sin(player.angle) * 5;

                if (player.y > 400 || player.y < 200) {
                    gameOver = true;
                }

                player.score++;
                scoreEl.innerText = Math.floor(player.score / 10);
            } else {
                ctx.fillStyle = 'white';
                ctx.font = '40px Space Grotesk';
                ctx.fillText('CRASHED', 300, 300);
            }

            requestAnimationFrame(draw);
        }

        window.addEventListener('mousedown', () => isHolding = true);
        window.addEventListener('mouseup', () => isHolding = false);
        window.addEventListener('touchstart', (e) => { e.preventDefault(); isHolding = true; });
        window.addEventListener('touchend', () => isHolding = false);

        draw();
    </script>
</body>
</html>
