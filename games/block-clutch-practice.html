<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block Clutch Practice</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background: #0a0a0c; color: #e0e0e0; font-family: 'Space Grotesk', sans-serif; overflow: hidden; touch-action: none; }
        #back-link { position: absolute; top: 20px; left: 20px; color: #555; text-decoration: none; font-size: 14px; z-index: 10; transition: color 0.3s; }
        #back-link:hover { color: #fff; }
        #ui { position: absolute; top: 20px; right: 20px; text-align: right; pointer-events: none; }
        #score { font-size: 24px; font-weight: bold; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
        canvas { display: block; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); }
        button { background: transparent; border: 2px solid #00ffcc; color: #00ffcc; padding: 15px 30px; font-size: 18px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; }
        button:hover { background: #00ffcc; color: #000; }
    </style>
</head>
<body>
    <a id="back-link" href="../index.html">← /grow</a>
    <div id="ui"><div id="score">SCORE: 0</div></div>
    <div id="overlay">
        <h1 style="margin-bottom: 10px;">BLOCK CLUTCH</h1>
        <p style="margin-bottom: 30px; color: #888;">Tap/Click to place blocks on the wall</p>
        <button onclick="startGame()">Start Practice</button>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');

    let w, h, score, player, blocks, gameRunning;

    function init() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', init);
    init();

    class Player {
        constructor() {
            this.x = w / 2;
            this.y = 50;
            this.vy = 0;
            this.size = 20;
        }
        update() {
            this.vy += 0.5;
            this.y += this.vy;
            if (this.y > h) resetGame();
        }
        draw() {
            ctx.fillStyle = '#fff';
            ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
        }
    }

    function startGame() {
        player = new Player();
        blocks = [];
        score = 0;
        gameRunning = true;
        overlay.style.display = 'none';
        animate();
    }

    function resetGame() {
        gameRunning = false;
        overlay.style.display = 'flex';
        overlay.querySelector('h1').innerText = "FAILED - SCORE: " + score;
    }

    window.addEventListener('mousedown', () => {
        if(!gameRunning) return;
        const bSize = 40;
        blocks.push({ x: w/2 - 20, y: player.y + 40, w: bSize, h: bSize });
        score++;
        scoreEl.innerText = "SCORE: " + score;
    });

    function animate() {
        if (!gameRunning) return;
        ctx.clearRect(0, 0, w, h);
        
        // Draw Wall
        ctx.fillStyle = '#1a1a1e';
        ctx.fillRect(w/2 - 50, 0, 100, h);

        player.update();
        player.draw();

        blocks.forEach((b, i) => {
            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(b.x, b.y, b.w, b.h);
            
            // Collision
            if (player.x + 10 > b.x && player.x - 10 < b.x + b.w &&
                player.y + 10 > b.y && player.y - 10 < b.y + b.h && player.vy > 0) {
                player.vy = -8;
            }
            
            b.y -= 2; 
            if (b.y < -50) blocks.splice(i, 1);
        });

        requestAnimationFrame(animate);
    }
</script>
</body>
</html>
