<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Barrel Horror</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #0a0a0a; color: #d4d4d4; font-family: 'Press Start 2P', cursive; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; border: 4px solid #333; overflow: hidden; background: #000; }
        #back-link { position: absolute; top: 20px; left: 20px; color: #666; text-decoration: none; font-size: 10px; z-index: 10; }
        #ui { position: absolute; top: 20px; right: 20px; text-align: right; pointer-events: none; }
        #player { position: absolute; width: 30px; height: 30px; background: #fff; border-radius: 50%; box-shadow: 0 0 20px #fff; z-index: 5; transition: 0.1s; }
        .barrel { position: absolute; width: 40px; height: 40px; background: #4a3728; border: 4px solid #2d2118; box-sizing: border-box; }
        .barrel::after { content: '×'; position: absolute; top: 5px; left: 10px; color: #2d2118; font-size: 20px; }
        #msg { position: absolute; width: 100%; top: 40%; text-align: center; font-size: 14px; line-height: 2; pointer-events: none; }
        #light-ring { position: absolute; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%); pointer-events: none; z-index: 1; transform: translate(-50%, -50%); }
    </style>
</head>
<body>

<a id="back-link" href="../index.html">← /grow</a>
<div id="game-container">
    <div id="light-ring"></div>
    <div id="player"></div>
    <div id="ui">OIL: <span id="oil">100</span>%</div>
    <div id="msg">MOVE TO ESCAPE<br>AVOID THE BARRELS</div>
</div>

<script>
    const player = document.getElementById('player');
    const oilEl = document.getElementById('oil');
    const light = document.getElementById('light-ring');
    const container = document.getElementById('game-container');
    
    let oil = 100;
    let px = window.innerWidth / 2;
    let py = window.innerHeight / 2;
    let barrels = [];

    function spawnBarrel() {
        if(barrels.length > 5) return;
        const b = document.createElement('div');
        b.className = 'barrel';
        b.style.left = Math.random() * (window.innerWidth - 40) + 'px';
        b.style.top = Math.random() * (window.innerHeight - 40) + 'px';
        container.appendChild(b);
        barrels.push({el: b, x: parseInt(b.style.left), y: parseInt(b.style.top)});
    }

    window.addEventListener('mousemove', (e) => {
        px = e.clientX; py = e.clientY;
    });

    window.addEventListener('touchmove', (e) => {
        px = e.touches[0].clientX; py = e.touches[0].clientY;
    });

    function gameLoop() {
        player.style.left = (px - 15) + 'px';
        player.style.top = (py - 15) + 'px';
        light.style.left = px + 'px';
        light.style.top = py + 'px';

        oil -= 0.05;
        oilEl.innerText = Math.floor(oil);
        
        barrels.forEach(b => {
            const dx = (px) - (b.x + 20);
            const dy = (py) - (b.y + 20);
            const dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < 30) {
                oil -= 0.5;
                b.el.style.background = '#ff0000';
            } else {
                b.el.style.background = '#4a3728';
            }
        });

        if(oil <= 0) {
            alert('THE DARKNESS CONSUMED YOU.');
            location.reload();
        } else {
            requestAnimationFrame(gameLoop);
        }
    }

    setInterval(spawnBarrel, 2000);
    gameLoop();
</script>
</body>
</html>
