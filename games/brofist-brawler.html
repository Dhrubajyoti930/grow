<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brofist Brawler</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #0a0a0a; color: #fff; font-family: 'Press Start 2P', cursive; overflow: hidden; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        canvas { display: block; image-rendering: pixelated; width: 100%; height: 100%; cursor: crosshair; }
        .ui { position: absolute; top: 20px; left: 20px; z-index: 10; }
        a { color: #555; text-decoration: none; font-size: 10px; transition: color 0.3s; }
        a:hover { color: #ff00ff; }
        #hud { position: absolute; top: 20px; right: 20px; text-align: right; pointer-events: none; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="ui"><a href="../index.html">← /grow</a></div>
    <div id="hud">SCORE: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    let w, h, score = 0, gameActive = true;
    let player = { x: 50, y: 0, w: 50, h: 50, vy: 0, grounded: false, power: 1 };
    let enemies = [];
    let tambourines = [];

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        player.y = h - 150;
    }
    window.addEventListener('resize', resize);
    resize();

    function spawn() {
        if (!gameActive) return;
        if (Math.random() < 0.03) enemies.push({ x: w, y: h - 100, w: 40, h: 40, speed: 2 + Math.random() * 3 });
        if (Math.random() < 0.005) tambourines.push({ x: w, y: Math.random() * (h - 200), w: 30, h: 30, dx: -2 });
        setTimeout(spawn, 1000);
    }
    spawn();

    function update() {
        if (!gameActive) return;
        
        // Player Physics
        player.vy += 0.8;
        player.y += player.vy;
        if (player.y > h - 150) { player.y = h - 150; player.vy = 0; player.grounded = true; }

        // Logic
        enemies.forEach((e, i) => {
            e.x -= e.speed;
            if (e.x + e.w < 0) enemies.splice(i, 1);
            if (Math.abs(e.x - player.x) < 50 && Math.abs(e.y - player.y) < 50) {
                score += 10;
                scoreEl.innerText = score;
                enemies.splice(i, 1);
            }
        });

        tambourines.forEach((t, i) => {
            t.x += t.dx;
            if (Math.abs(t.x - player.x) < 50 && Math.abs(t.y - player.y) < 50) {
                player.power += 0.5;
                tambourines.splice(i, 1);
            }
        });

        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, w, h);
        
        // Floor
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(0, h - 100, w, 100);

        // Player
        ctx.fillStyle = '#ff00ff';
        ctx.fillRect(player.x, player.y, player.w * player.power, player.h);

        // Enemies
        ctx.fillStyle = '#00ffff';
        enemies.forEach(e => ctx.fillRect(e.x, e.y, e.w, e.h));

        // Tambourines
        ctx.fillStyle = '#ffcc00';
        tambourines.forEach(t => ctx.beginPath(), ctx.arc(t.x, t.y, 15, 0, Math.PI*2), ctx.fill());
    }

    window.addEventListener('mousedown', () => { if (player.grounded) { player.vy = -15; player.grounded = false; }});
    update();
</script>
</body>
</html>
