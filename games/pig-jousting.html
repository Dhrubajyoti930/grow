<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pig Jousting</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #0a0a0c; color: #e0e0e0; font-family: 'Press Start 2P', cursive; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; touch-action: none; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; }
        a { color: #555; text-decoration: none; font-size: 10px; }
        a:hover { color: #fff; }
        #game-container { position: relative; width: 100%; max-width: 600px; height: 400px; border: 4px solid #333; background: #151518; overflow: hidden; }
        canvas { width: 100%; height: 100%; image-rendering: pixelated; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); }
        button { background: #ff7675; border: none; padding: 15px 30px; color: white; cursor: pointer; font-family: inherit; margin-top: 20px; }
    </style>
</head>
<body>

<div id="ui"><a href="../index.html">← /grow</a></div>

<div id="game-container">
    <canvas id="canvas"></canvas>
    <div id="overlay">
        <h2 id="msg">PIG JOUST</h2>
        <button onclick="startGame()">START JOUST</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 600; canvas.height = 400;

    let p1 = { x: 50, y: 200, vy: 0, score: 0 }, p2 = { x: 500, y: 200, vy: 0, score: 0 };
    let gameActive = false, frame = 0;

    function draw() {
        ctx.fillStyle = '#151518';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Draw track
        ctx.strokeStyle = '#333';
        ctx.beginPath(); ctx.moveTo(0, 300); ctx.lineTo(600, 300); ctx.stroke();

        // Draw Pigs
        ctx.fillStyle = '#ffafbd';
        ctx.fillRect(p1.x, 250, 50, 50); // P1 Pig
        ctx.fillStyle = '#ff7675';
        ctx.fillRect(p1.x + 40, 260, 30, 10); // P1 Lance

        ctx.fillStyle = '#74b9ff';
        ctx.fillRect(p2.x, 250, 50, 50); // P2 Pig
        ctx.fillStyle = '#0984e3';
        ctx.fillRect(p2.x - 20, 260, 30, 10); // P2 Lance

        if(gameActive) {
            p1.x += 2 + Math.random();
            p2.x -= 2 + Math.random();

            if(p1.x + 70 > p2.x) {
                gameActive = false;
                document.getElementById('overlay').style.display = 'flex';
                document.getElementById('msg').innerText = "CLASH!";
            }
        }
    }

    function startGame() {
        p1.x = 50; p2.x = 500;
        gameActive = true;
        document.getElementById('overlay').style.display = 'none';
    }

    function loop() {
        draw();
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
