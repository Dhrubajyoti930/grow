<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Physics Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #0a0a0a; color: #fff; font-family: 'Press+Start+2P', cursive; overflow: hidden; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; padding: 20px; box-sizing: border-box; display: flex; justify-content: space-between; pointer-events: none; }
        a { color: #555; text-decoration: none; pointer-events: auto; font-size: 10px; }
        #msg { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #ff3333; font-size: 12px; pointer-events: none; }
        canvas { display: block; image-rendering: pixelated; }
    </style>
</head>
<body>
    <div id="ui">
        <a href="../index.html">← /grow</a>
        <div id="score">DIST: 0</div>
    </div>
    <div id="msg">HOLD TO ACCELERATE | DON'T DIE</div>
    <canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    let width, height;
    let camX = 0;
    let dist = 0;
    let gameActive = true;

    const player = { x: 50, y: 300, vx: 0, vy: 0, rot: 0, grounded: false };
    const platforms = [{x: 0, y: 400, w: 1000, h: 50}];
    let keys = { ArrowRight: false };

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    window.onkeydown = (e) => keys[e.code] = true;
    window.onkeyup = (e) => keys[e.code] = false;
    canvas.onmousedown = () => keys.ArrowRight = true;
    canvas.onmouseup = () => keys.ArrowRight = false;

    function spawnPlatform() {
        const last = platforms[platforms.length - 1];
        const nextX = last.x + last.w + (Math.random() * 200 + 100);
        const nextW = Math.max(50, 200 - (dist / 50));
        platforms.push({x: nextX, y: 350 + Math.random() * 100 - 50, w: nextW, h: 400});
        if(platforms.length > 5) platforms.shift();
    }

    function update() {
        if(!gameActive) return;

        if(keys.ArrowRight) player.vx += 0.5;
        player.vx *= 0.98;
        player.vy += 0.8;
        player.x += player.vx;
        player.y += player.vy;

        player.grounded = false;
        platforms.forEach(p => {
            if(player.x + 30 > p.x && player.x < p.x + p.w && player.y + 30 > p.y && player.y + 30 < p.y + 20) {
                player.y = p.y - 30;
                player.vy = 0;
                player.grounded = true;
            }
        });

        if(player.y > height) gameActive = false;
        
        camX = player.x - 200;
        dist = Math.floor(player.x / 10);
        scoreEl.innerText = "DIST: " + dist;

        if(player.x > platforms[platforms.length-1].x - 500) spawnPlatform();
    }

    function draw() {
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = '#33ff33';
        platforms.forEach(p => ctx.fillRect(p.x - camX, p.y, p.w, p.h));

        ctx.fillStyle = '#ff3366';
        ctx.fillRect(player.x - camX, player.y, 30, 30);
        
        if(!gameActive) {
            ctx.fillStyle = 'white';
            ctx.fillText("CRUSHED. RELOAD.", width/2 - 100, height/2);
        }

        update();
        requestAnimationFrame(draw);
    }

    draw();
</script>
</body>
</html>
