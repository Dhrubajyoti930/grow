<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elytra Flight Sim</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; font-family: 'Space Grotesk', sans-serif; color: #fff; }
        #canvas { display: block; touch-action: none; }
        .ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .back-link { position: absolute; top: 20px; left: 20px; color: #666; text-decoration: none; font-size: 14px; pointer-events: auto; }
        .back-link:hover { color: #fff; }
        .stats { position: absolute; top: 20px; right: 20px; text-align: right; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.8); pointer-events: auto; }
        button { background: transparent; border: 1px solid #fff; color: #fff; padding: 15px 30px; cursor: pointer; font-family: inherit; font-size: 18px; margin-top: 20px; }
        button:hover { background: #fff; color: #000; }
    </style>
</head>
<body>

<a href="../index.html" class="back-link">← /grow</a>

<div class="ui">
    <div class="stats">SCORE: <span id="score">0</span></div>
</div>

<div id="overlay">
    <h1>ELYTRA FLIGHT</h1>
    <p>Hold to dive, release to soar</p>
    <button onclick="startGame()">START FLIGHT</button>
</div>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');

    let w, h, score, gameRunning = false;
    let player = { y: 0, v: 0, size: 10 };
    let rings = [];

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function startGame() {
        score = 0;
        player.y = h/2;
        player.v = 0;
        rings = [];
        gameRunning = true;
        overlay.style.display = 'none';
        loop();
    }

    let pressed = false;
    window.addEventListener('mousedown', () => pressed = true);
    window.addEventListener('mouseup', () => pressed = false);
    window.addEventListener('touchstart', (e) => { e.preventDefault(); pressed = true; });
    window.addEventListener('touchend', () => pressed = false);

    function loop() {
        if(!gameRunning) return;

        ctx.fillStyle = '#0a0a0c';
        ctx.fillRect(0, 0, w, h);

        // Physics
        player.v += pressed ? 0.5 : -0.2;
        player.y += player.v;

        if(player.y < 0 || player.y > h) gameRunning = false;

        // Rings
        if(Math.random() < 0.02) {
            rings.push({ x: w, y: Math.random() * (h - 200) + 100, passed: false });
        }

        ctx.strokeStyle = '#00f2ff';
        ctx.lineWidth = 4;

        rings.forEach((r, i) => {
            r.x -= 5;
            ctx.beginPath();
            ctx.arc(r.x, r.y, 40, 0, Math.PI*2);
            ctx.stroke();

            if(Math.abs(r.x - 100) < 20 && Math.abs(player.y - r.y) < 40) {
                if(!r.passed) { score++; r.passed = true; scoreEl.innerText = score; }
            }
            if(r.x < -50) rings.splice(i, 1);
        });

        // Player
        ctx.fillStyle = '#fff';
        ctx.fillRect(80, player.y - 5, 40, 10);

        requestAnimationFrame(loop);
        if(!gameRunning) overlay.style.display = 'flex';
    }
</script>
</body>
</html>
