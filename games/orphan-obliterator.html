<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orphan Obliterator</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #0a0a0a; color: #fff; font-family: 'Roboto', sans-serif; overflow: hidden; touch-action: none; }
        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; }
        .nav { padding: 20px; font-family: 'Press Start 2P', cursive; font-size: 10px; }
        .nav a { color: #555; text-decoration: none; }
        #canvas-container { flex-grow: 1; position: relative; cursor: crosshair; }
        canvas { display: block; width: 100%; height: 100%; }
        #overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: rgba(0,0,0,0.8); padding: 2rem; border: 2px solid #333; }
        h1 { font-family: 'Press Start 2P', cursive; color: #ff3e3e; font-size: 24px; margin-bottom: 20px; }
        button { background: #ff3e3e; color: #fff; border: none; padding: 15px 30px; font-family: 'Press Start 2P'; cursor: pointer; }
        #stats { position: absolute; bottom: 20px; left: 20px; font-family: 'Press Start 2P'; font-size: 12px; color: #00ffcc; }
    </style>
</head>
<body>

<div id="game-ui">
    <div class="nav"><a href="../index.html">← /grow</a></div>
    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <div id="overlay">
            <h1>ORPHAN OBLITERATOR</h1>
            <p id="msg">TAP TO START THE SLAUGHTER</p>
            <button onclick="startGame()">ENTER THE ARENA</button>
        </div>
    </div>
    <div id="stats">LOOT: 0 | LEVEL: 1</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const stats = document.getElementById('stats');
    
    let loot = 0, level = 1, gameActive = false;
    let boss = { x: 0, y: 0, hp: 100, maxHp: 100, size: 50 };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        boss.x = canvas.width / 2;
        boss.y = canvas.height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    function startGame() {
        gameActive = true;
        overlay.style.display = 'none';
        loop();
    }

    canvas.addEventListener('pointerdown', (e) => {
        if (!gameActive) return;
        const dx = e.clientX - boss.x;
        const dy = e.clientY - boss.y;
        if (Math.hypot(dx, dy) < boss.size + 50) {
            boss.hp -= 10;
            if (boss.hp <= 0) {
                loot += (level * 100);
                level++;
                boss.hp = 100 + (level * 50);
                boss.maxHp = boss.hp;
            }
            stats.innerText = `LOOT: ${loot} | LEVEL: ${level}`;
        }
    });

    function loop() {
        if (!gameActive) return;
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Draw Boss
        ctx.fillStyle = '#ff3e3e';
        ctx.beginPath();
        ctx.arc(boss.x, boss.y, boss.size, 0, Math.PI * 2);
        ctx.fill();
        
        // HP Bar
        ctx.fillStyle = '#333';
        ctx.fillRect(boss.x - 50, boss.y - 80, 100, 10);
        ctx.fillStyle = '#00ffcc';
        ctx.fillRect(boss.x - 50, boss.y - 80, (boss.hp / boss.maxHp) * 100, 10);

        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
