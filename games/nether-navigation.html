<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nether Navigation</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #1a0505; color: #ff4500; font-family: 'Press Start 2P', cursive; overflow: hidden; touch-action: none; }
        #back-link { position: absolute; top: 20px; left: 20px; color: #ff8c00; text-decoration: none; font-size: 10px; z-index: 10; }
        canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
        #ui { position: absolute; top: 20px; right: 20px; text-align: right; pointer-events: none; }
        #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; display: none; }
    </style>
</head>
<body>
    <a id="back-link" href="../index.html">← /grow</a>
    <div id="ui">SCORE: <span id="score">0</span></div>
    <div id="msg">GAME OVER<br><br><span style="font-size: 10px; color: #fff;">TAP TO RESTART</span></div>
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const msgEl = document.getElementById('msg');

        let w, h, score, gameRunning, player, blocks, fireballs;

        function init() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            score = 0;
            gameRunning = true;
            player = { x: 50, y: h/2 - 50, w: 30, h: 30, vel: 0 };
            blocks = [{x: 0, y: h/2, w: 200}];
            fireballs = [];
            msgEl.style.display = 'none';
            scoreEl.innerText = score;
            requestAnimationFrame(update);
        }

        window.addEventListener('touchstart', (e) => {
            if(!gameRunning) init();
            else player.vel = -8;
        });

        function update() {
            if(!gameRunning) return;

            // Physics
            player.vel += 0.5;
            player.y += player.vel;

            // Lava check
            if(player.y > h - 100) gameOver();

            // Spawn blocks
            if(blocks[blocks.length-1].x < w - 200) {
                blocks.push({x: w, y: h/2 + Math.random()*100 - 50, w: 100 + Math.random()*100});
            }

            // Move blocks
            blocks.forEach(b => b.x -= 3);
            blocks = blocks.filter(b => b.x + b.w > 0);

            // Collisions
            let onBlock = false;
            blocks.forEach(b => {
                if(player.x < b.x + b.w && player.x + player.w > b.x && 
                   player.y + player.h > b.y && player.y + player.h < b.y + 20) {
                    player.y = b.y - player.h;
                    player.vel = 0;
                    onBlock = true;
                }
            });

            // Fireballs
            if(Math.random() < 0.02) fireballs.push({x: w, y: Math.random() * h, r: 8});
            fireballs.forEach((f, i) => {
                f.x -= 5;
                if(Math.hypot(f.x - (player.x+15), f.y - (player.y+15)) < 20) gameOver();
                if(f.x < 0) fireballs.splice(i, 1);
            });

            score++;
            scoreEl.innerText = Math.floor(score/10);

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.fillStyle = '#2a0a0a';
            ctx.fillRect(0, 0, w, h);
            
            // Lava
            ctx.fillStyle = '#ff4500';
            ctx.fillRect(0, h-50, w, 50);

            // Player
            ctx.fillStyle = '#8b0000';
            ctx.fillRect(player.x, player.y, player.w, player.h);

            // Blocks
            ctx.fillStyle = '#3e2723';
            blocks.forEach(b => ctx.fillRect(b.x, b.y, b.w, 20));

            // Fireballs
            ctx.fillStyle = '#fff000';
            fireballs.forEach(f => {
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
                ctx.fill();
            });
        }

        function gameOver() {
            gameRunning = false;
            msgEl.style.display = 'block';
        }

        init();
    </script>
</body>
</html>
