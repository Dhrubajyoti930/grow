<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Reviewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0c; --accent: #00ff9d; --danger: #ff4757; --panel: #1a1a1f; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        a { color: #888; text-decoration: none; font-family: 'Press Start 2P', cursive; font-size: 10px; position: absolute; top: 20px; left: 20px; }
        #game-container { margin-top: 60px; width: 90%; max-width: 400px; text-align: center; }
        .meme-box { width: 100%; height: 300px; background: #222; border: 4px solid #333; display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .meme-art { font-size: 40px; cursor: default; user-select: none; }
        .stats { font-family: 'Press Start 2P', cursive; font-size: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 15px; border: none; cursor: pointer; font-family: 'Press Start 2P', cursive; transition: transform 0.1s; }
        button:active { transform: scale(0.95); }
        .btn-up { background: var(--accent); color: #000; }
        .btn-down { background: var(--danger); color: #fff; }
        #log { margin-top: 20px; font-size: 14px; color: #aaa; min-height: 20px; }
        .overlay { position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
    </style>
</head>
<body>

<a href="../index.html">← /grow</a>

<div id="game-container">
    <div class="stats">
        <span>REP: <span id="rep">0</span></span>
        <span>BAN: <span id="ban">0</span>%</span>
    </div>
    <div class="meme-box" id="meme">
        <div class="meme-art" id="art">ಠ_ಠ</div>
    </div>
    <div class="btn-group">
        <button class="btn-up" onclick="rate(1)">LIKE</button>
        <button class="btn-down" onclick="rate(-1)">DANK</button>
    </div>
    <div id="log">Reviewing memes...</div>
</div>

<div id="game-over" class="overlay">
    <h1 style="color:var(--danger)">BANNED</h1>
    <button onclick="location.reload()">RETRY</button>
</div>

<script>
    const arts = ["( ͡° ͜ʖ ͡°)", "¯\\_(ツ)_/¯", "༼ つ ◕_◕ ༽つ", "ಠ_ಠ", "ʕ•ᴥ•ʔ", "ᕦ(ò_óˇ)ᕤ", "♪(┌・。・)┌", "(╯°□°）╯︵ ┻━┻"];
    let rep = 0;
    let ban = 0;

    function rate(val) {
        const isDank = Math.random() > 0.6;
        if ((val === 1 && isDank) || (val === -1 && !isDank)) {
            rep += 10;
            document.getElementById('log').innerText = "Nice catch!";
        } else {
            ban += 25;
            document.getElementById('log').innerText = "Content policy violation!";
        }
        
        update();
        if(ban >= 100) {
            document.getElementById('game-over').style.display = 'flex';
        } else {
            generateMeme();
        }
    }

    function generateMeme() {
        document.getElementById('art').innerText = arts[Math.floor(Math.random() * arts.length)];
    }

    function update() {
        document.getElementById('rep').innerText = rep;
        document.getElementById('ban').innerText = ban;
    }

    generateMeme();
</script>
</body>
</html>
