<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simplex Noise Field</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0c; --panel: #16161a; --accent: #00f2ff; --text: #e0e0e0; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; overflow: hidden; }
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        .ui { position: absolute; top: 20px; right: 20px; width: 260px; background: rgba(22, 22, 26, 0.85); backdrop-filter: blur(10px); padding: 20px; border-radius: 12px; border: 1px solid #333; z-index: 1; user-select: none; }
        .back-link { position: absolute; top: 20px; left: 20px; z-index: 2; color: var(--accent); text-decoration: none; font-size: 0.9rem; letter-spacing: 1px; }
        h1 { font-size: 1rem; margin: 0 0 15px 0; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; }
        .control { margin-bottom: 15px; }
        label { display: block; font-size: 0.75rem; margin-bottom: 5px; opacity: 0.7; }
        input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
        .val { float: right; color: var(--accent); }
    </style>
</head>
<body>
    <a href="../index.html" class="back-link">← /grow</a>
    <canvas id="canvas"></canvas>
    <div class="ui">
        <h1>Noise Field</h1>
        <div class="control">
            <label>Octaves <span id="octVal" class="val">4</span></label>
            <input type="range" id="oct" min="1" max="8" step="1" value="4">
        </div>
        <div class="control">
            <label>Persistence <span id="perVal" class="val">0.5</span></label>
            <input type="range" id="per" min="0.1" max="1" step="0.05" value="0.5">
        </div>
        <div class="control">
            <label>Scale <span id="sclVal" class="val">0.005</span></label>
            <input type="range" id="scl" min="0.001" max="0.02" step="0.001" value="0.005">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let octaves = 4, persistence = 0.5, scale = 0.005;

        const p = new Uint8Array(512);
        for(let i=0; i<256; i++) p[i] = p[i+256] = Math.floor(Math.random() * 256);

        function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
        function lerp(t, a, b) { return a + t * (b - a); }
        function grad(hash, x, y) {
            const h = hash & 15;
            const u = h < 8 ? x : y;
            const v = h < 4 ? y : h === 12 || h === 14 ? x : 0;
            return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
        }

        function noise(x, y) {
            const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
            x -= Math.floor(x); y -= Math.floor(y);
            const u = fade(x), v = fade(y);
            const a = p[X] + Y, aa = p[a], ab = p[a + 1];
            const b = p[X + 1] + Y, ba = p[b], bb = p[b + 1];
            return lerp(v, lerp(u, grad(p[aa], x, y), grad(p[ba], x - 1, y)), lerp(u, grad(p[ab], x, y - 1), grad(p[bb], x - 1, y - 1)));
        }

        function draw() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const img = ctx.createImageData(canvas.width, canvas.height);
            for(let x=0; x<canvas.width; x++) {
                for(let y=0; y<canvas.height; y++) {
                    let amp = 1, freq = scale, val = 0, max = 0;
                    for(let i=0; i<octaves; i++) {
                        val += noise(x * freq, y * freq) * amp;
                        max += amp; amp *= persistence; freq *= 2;
                    }
                    const c = (val/max + 1) * 128;
                    const idx = (x + y * canvas.width) * 4;
                    img.data[idx] = c * 0.5; img.data[idx+1] = c * 0.8; img.data[idx+2] = c; img.data[idx+3] = 255;
                }
            }
            ctx.putImageData(img, 0, 0);
        }

        ['oct', 'per', 'scl'].forEach(id => document.getElementById(id).oninput = (e) => {
            if(id==='oct') octaves = parseInt(e.target.value);
            if(id==='per') persistence = parseFloat(e.target.value);
            if(id==='scl') scale = parseFloat(e.target.value);
            document.getElementById(id + 'Val').innerText = e.target.value;
            draw();
        });

        window.onresize = draw;
        draw();
    </script>
</body>
</html>
