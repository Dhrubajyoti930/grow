<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proof by Induction</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --panel: #16161a;
            --accent: #00f2ff;
            --text: #e0e0e0;
            --domino: #ffffff;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        #back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0.7;
        }
        #back-link:hover { opacity: 1; }
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            margin-top: 50px;
        }
        h1 { margin-bottom: 0.5rem; letter-spacing: -1px; }
        .desc { opacity: 0.6; font-size: 0.85rem; margin-bottom: 2rem; }
        
        #stage {
            height: 200px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 10px;
            overflow: hidden;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .domino {
            width: 30px;
            height: 60px;
            background: var(--domino);
            border-radius: 4px;
            transition: transform 0.3s ease;
            transform-origin: bottom center;
            position: relative;
        }
        .domino::after {
            content: "";
            position: absolute;
            top: 10px; left: 10px; width: 10px; height: 10px;
            background: var(--bg);
            border-radius: 50%;
        }
        .fallen { transform: rotate(90deg); }
        
        .controls { margin-top: 40px; }
        button {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 25px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        button:hover { background: var(--accent); color: var(--bg); }
    </style>
</head>
<body>

<a href="../index.html" id="back-link">← /grow</a>

<div class="container">
    <h1>Proof by Induction</h1>
    <p class="desc">Base Case: P(1) is true. Inductive Step: P(k) → P(k+1).</p>

    <div id="stage"></div>

    <div class="controls">
        <button onclick="startInduction()">Trigger Induction</button>
        <button onclick="reset()">Reset</button>
    </div>
</div>

<script>
    const stage = document.getElementById('stage');
    const count = 12;

    function reset() {
        stage.innerHTML = '';
        for (let i = 0; i < count; i++) {
            const d = document.createElement('div');
            d.className = 'domino';
            stage.appendChild(d);
        }
    }

    async function startInduction() {
        const dominoes = document.querySelectorAll('.domino');
        for (let d of dominoes) {
            d.classList.add('fallen');
            await new Promise(r => setTimeout(r, 200));
        }
    }

    reset();
</script>

</body>
</html>
