<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayes Theorem Tree</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --panel: #151518;
            --accent: #00ff9d;
            --text: #e0e0e0;
            --dim: #888;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        #nav { width: 100%; max-width: 800px; margin-bottom: 20px; }
        #nav a { color: var(--accent); text-decoration: none; font-family: 'JetBrains Mono'; font-size: 0.9rem; }
        
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--panel);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2a2a2a;
        }
        h1 { font-family: 'JetBrains Mono'; color: var(--accent); margin-top: 0; }
        
        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        label { display: block; font-size: 0.8rem; color: var(--dim); margin-bottom: 5px; text-transform: uppercase; }
        input { 
            width: 100%; background: #000; border: 1px solid #333; color: white; 
            padding: 10px; border-radius: 4px; font-family: 'JetBrains Mono'; box-sizing: border-box;
        }
        
        .tree-viz { display: flex; flex-direction: column; gap: 10px; font-family: 'JetBrains Mono'; }
        .node { padding: 15px; border-left: 3px solid var(--accent); background: #1c1c20; margin-bottom: 5px; border-radius: 0 4px 4px 0; }
        .result { margin-top: 20px; padding: 20px; background: #0f201a; border: 1px solid var(--accent); color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

<div id="nav"><a href="../index.html">← /grow</a></div>

<div class="container">
    <h1>Bayes Tree</h1>
    <div class="input-group">
        <div>
            <label>P(A) - Prior</label>
            <input type="number" id="pA" value="0.1" step="0.01" oninput="calculate()">
        </div>
        <div>
            <label>P(B|A) - Likelihood</label>
            <input type="number" id="pBA" value="0.9" step="0.01" oninput="calculate()">
        </div>
        <div>
            <label>P(B|¬A) - False Pos</label>
            <input type="number" id="pBnotA" value="0.05" step="0.01" oninput="calculate()">
        </div>
    </div>

    <div class="tree-viz" id="tree"></div>
    <div class="result" id="res"></div>
</div>

<script>
    function calculate() {
        const pA = parseFloat(document.getElementById('pA').value) || 0;
        const pNotA = 1 - pA;
        const pBA = parseFloat(document.getElementById('pBA').value) || 0;
        const pBnotA = parseFloat(document.getElementById('pBnotA').value) || 0;

        const pB = (pA * pBA) + (pNotA * pBnotA);
        const pAGivenB = (pA * pBA) / pB;

        const tree = document.getElementById('tree');
        tree.innerHTML = `
            <div class="node">Root: 100% population</div>
            <div class="node" style="margin-left: 20px;">A: ${(pA * 100).toFixed(1)}% → (B|A: ${pBA * 100}%) = ${(pA * pBA * 100).toFixed(1)}%</div>
            <div class="node" style="margin-left: 20px;">¬A: ${(pNotA * 100).toFixed(1)}% → (B|¬A: ${pBnotA * 100}%) = ${(pNotA * pBnotA * 100).toFixed(1)}%</div>
        `;

        document.getElementById('res').innerHTML = 
            `P(A|B) = ${(pAGivenB * 100).toFixed(2)}%<br>
            <small style="font-weight:normal; color:#aaa;">The probability of A given that B has occurred.</small>`;
    }
    calculate();
</script>

</body>
</html>
