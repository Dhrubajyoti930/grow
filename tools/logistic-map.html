<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistic Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --panel: #16161a;
            --accent: #00f2ff;
            --text: #e1e1e6;
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Space Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        #back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .container {
            margin-top: 80px;
            width: 90vw;
            max-width: 800px;
            text-align: center;
        }
        canvas {
            background: var(--panel);
            width: 100%;
            height: 400px;
            border: 1px solid #333;
            image-rendering: pixelated;
        }
        .controls {
            margin-top: 20px;
            padding: 20px;
            background: var(--panel);
            border: 1px solid #333;
        }
        input[type=range] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }
        h1 { font-size: 1.5rem; margin-bottom: 5px; }
        p { font-size: 0.8rem; opacity: 0.7; }
        .val { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

    <a id="back-link" href="../index.html">← /grow</a>

    <div class="container">
        <h1>Logistic Map</h1>
        <p>x<sub>n+1</sub> = r &middot; x<sub>n</sub>(1 - x<sub>n</sub>)</p>
        
        <canvas id="canvas"></canvas>
        
        <div class="controls">
            <label>Growth Rate (r): <span id="rVal" class="val">3.00</span></label>
            <input type="range" id="rSlider" min="2.5" max="4.0" step="0.001" value="3.0">
            <p>Adjust the slider to see population stability give way to chaos.</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const rSlider = document.getElementById('rSlider');
        const rVal = document.getElementById('rVal');

        function resize() {
            canvas.width = canvas.offsetWidth * window.devicePixelRatio;
            canvas.height = canvas.offsetHeight * window.devicePixelRatio;
            draw();
        }

        function draw() {
            const r = parseFloat(rSlider.value);
            rVal.textContent = r.toFixed(3);
            
            ctx.fillStyle = '#16161a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            let x = 0.5;
            const iterations = 100;
            const skip = 50;
            
            ctx.fillStyle = '#00f2ff';
            
            for (let i = 0; i < iterations; i++) {
                x = r * x * (1 - x);
                if (i > skip) {
                    const px = (i - skip) / (iterations - skip) * canvas.width;
                    const py = canvas.height - (x * canvas.height);
                    ctx.fillRect(px, py, 3, 3);
                }
            }
        }

        rSlider.addEventListener('input', draw);
        window.addEventListener('resize', resize);
        resize();
    </script>
</body>
</html>
