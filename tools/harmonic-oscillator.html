<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonic Oscillator</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --panel: #16161a;
            --accent: #00f2ff;
            --text: #e0e0e0;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        a { color: var(--accent); text-decoration: none; font-size: 0.9rem; position: absolute; top: 20px; left: 20px; opacity: 0.7; }
        .container { width: 100%; max-width: 800px; padding: 20px; text-align: center; }
        canvas { background: var(--panel); border-radius: 8px; width: 100%; height: 300px; cursor: crosshair; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; background: var(--panel); padding: 20px; border-radius: 8px; }
        .slider-group { display: flex; flex-direction: column; gap: 5px; text-align: left; }
        input { accent-color: var(--accent); cursor: pointer; }
        label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #888; }
        .stats { margin-top: 10px; font-weight: 600; color: var(--accent); }
    </style>
</head>
<body>

<a href="../index.html">← /grow</a>

<div class="container">
    <h1>Harmonic Oscillator</h1>
    <canvas id="canvas"></canvas>
    <div class="stats" id="modeText">Status: Underdamped</div>
    
    <div class="controls">
        <div class="slider-group">
            <label>Stiffness (k)</label>
            <input type="range" id="k" min="0.01" max="0.2" step="0.01" value="0.05">
        </div>
        <div class="slider-group">
            <label>Damping (c)</label>
            <input type="range" id="c" min="0" max="0.1" step="0.001" value="0.01">
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const modeText = document.getElementById('modeText');
    
    let w = canvas.width = 800;
    let h = canvas.height = 300;
    
    let x = 100, v = 0;
    const m = 1;
    let k = 0.05, c = 0.01;

    document.getElementById('k').oninput = (e) => k = parseFloat(e.target.value);
    document.getElementById('c').oninput = (e) => c = parseFloat(e.target.value);

    function animate() {
        // Simple Physics: F = -kx - cv
        let force = -k * (x - w/2) - c * v;
        let a = force / m;
        v += a;
        x += v;

        // Mode detection
        let disc = c*c - 4*m*k;
        let mode = disc > 0 ? "Overdamped" : (disc < 0 ? "Underdamped" : "Critically Damped");
        modeText.innerText = `Status: ${mode}`;

        ctx.clearRect(0, 0, w, h);
        
        // Draw equilibrium line
        ctx.strokeStyle = '#333';
        ctx.beginPath(); ctx.moveTo(w/2, 0); ctx.lineTo(w/2, h); ctx.stroke();

        // Draw spring
        ctx.strokeStyle = '#555';
        ctx.beginPath();
        ctx.moveTo(0, h/2);
        for(let i=0; i<20; i++) {
            ctx.lineTo((x * (i/20)) + (w/2 * (1 - i/20)), h/2 + (i%2 ? 10 : -10));
        }
        ctx.lineTo(x, h/2);
        ctx.stroke();

        // Draw Mass
        ctx.fillStyle = '#00f2ff';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00f2ff';
        ctx.fillRect(x - 20, h/2 - 20, 40, 40);
        ctx.shadowBlur = 0;

        requestAnimationFrame(animate);
    }

    canvas.onmousedown = (e) => {
        const rect = canvas.getBoundingClientRect();
        x = e.clientX - rect.left;
        v = 0;
    };

    animate();
</script>

</body>
</html>
