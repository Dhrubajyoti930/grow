<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculus Chain Rule</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --accent: #00f2ff;
            --gear-base: #1a1a20;
            --text: #e0e0e0;
        }

        body, html {
            margin: 0; padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .back-link {
            position: absolute; top: 20px; left: 20px;
            color: var(--accent); text-decoration: none; font-size: 0.9rem;
            opacity: 0.7; transition: opacity 0.3s;
        }

        .back-link:hover { opacity: 1; }

        .container { text-align: center; z-index: 1; }

        .formula {
            font-size: 2rem;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
        }

        .gear-system {
            display: flex; gap: 40px;
            align-items: center; justify-content: center;
            margin-top: 50px;
        }

        .gear {
            width: 120px; height: 120px;
            border: 8px solid var(--accent);
            border-radius: 50%;
            position: relative;
            display: flex; align-items: center; justify-content: center;
            background: var(--gear-base);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
        }

        .gear::after {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            border: 4px dashed #333;
            border-radius: 50%;
            animation: rotate 10s linear infinite;
        }

        .gear-f { animation: rotate 4s linear infinite; }
        .gear-g { animation: rotate 6s linear infinite reverse; }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .label {
            position: absolute; bottom: -50px;
            font-size: 0.8rem; text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info { margin-top: 100px; max-width: 400px; font-weight: 300; opacity: 0.6; }
    </style>
</head>
<body>

    <a href="../index.html" class="back-link">← /grow</a>

    <div class="container">
        <h1>Chain Rule</h1>
        <div class="formula">dy/dx = dy/du · du/dx</div>
        
        <div class="gear-system">
            <div class="gear gear-f">
                <span style="font-size: 2rem">f'</span>
                <div class="label">Outer Func</div>
            </div>
            <div style="font-size: 2rem">×</div>
            <div class="gear gear-g">
                <span style="font-size: 2rem">g'</span>
                <div class="label">Inner Func</div>
            </div>
        </div>

        <div class="info">
            Like nested gears, the rate of change of the whole is the product of the change in parts.
        </div>
    </div>

    <script>
        // Interactive feel
        document.addEventListener('mousemove', (e) => {
            const gears = document.querySelectorAll('.gear');
            const speed = (e.clientX / window.innerWidth) * 20;
            gears.forEach(g => g.style.animationDuration = `${20 - speed}s`);
        });
    </script>
</body>
</html>
