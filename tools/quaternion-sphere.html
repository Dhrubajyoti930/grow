<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quaternion Sphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #0a0a0c; color: #e0e0e0; font-family: 'Space Mono', monospace; overflow: hidden; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: move; }
        .ui { position: absolute; z-index: 10; padding: 20px; pointer-events: none; }
        .back-link { position: absolute; top: 20px; left: 20px; font-size: 12px; text-decoration: none; color: #666; pointer-events: auto; transition: color 0.3s; }
        .back-link:hover { color: #fff; }
        .controls { position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7); border: 1px solid #333; padding: 15px; pointer-events: auto; border-radius: 4px; font-size: 10px; width: 200px; }
        h1 { font-size: 16px; margin: 0 0 10px 0; letter-spacing: 2px; color: #00ffcc; }
    </style>
</head>
<body>

<a href="../index.html" class="back-link">← /grow</a>

<div class="ui">
    <h1>QUATERNION SPHERE</h1>
</div>

<div class="controls">
    Dragging rotates the 4D orientation.<br><br>
    The visual represents a 3-sphere (S³) projected into 3D space via stereographic projection. Points are color-mapped to their 4D-to-3D scalar distance.
</div>

<div id="canvas-container"></div>

<script>
    const container = document.getElementById('canvas-container');
    const width = window.innerWidth;
    const height = window.innerHeight;

    // Minimal Canvas rendering
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    container.appendChild(canvas);
    const ctx = canvas.getContext('2d');

    let rotX = 0, rotY = 0;
    let mouseX = 0, mouseY = 0;
    let isDragging = false;

    // Simulation state
    const points = [];
    for(let i = 0; i < 800; i++) {
        points.push({
            x: Math.random() * 2 - 1,
            y: Math.random() * 2 - 1,
            z: Math.random() * 2 - 1,
            w: Math.random() * 2 - 1
        });
    }

    function draw() {
        ctx.fillStyle = '#0a0a0c';
        ctx.fillRect(0, 0, width, height);

        rotX += (mouseY * 0.01 - rotX) * 0.1;
        rotY += (mouseX * 0.01 - rotY) * 0.1;

        points.forEach(p => {
            // Apply simple 4D rotation
            let x = p.x, y = p.y, z = p.z, w = p.w;
            let tmp = x * Math.cos(rotX) - w * Math.sin(rotX);
            w = x * Math.sin(rotX) + w * Math.cos(rotX);
            x = tmp;

            // Stereographic projection: (x,y,z,w) -> (x,y,z) / (1 - w)
            const scale = 200 / (1.5 - w);
            const px = x * scale + width / 2;
            const py = y * scale + height / 2;
            const size = Math.max(0.5, scale / 50);

            ctx.fillStyle = `hsl(${200 + w * 50}, 80%, 60%)`;
            ctx.beginPath();
            ctx.arc(px, py, size, 0, Math.PI * 2);
            ctx.fill();
        });

        requestAnimationFrame(draw);
    }

    window.addEventListener('mousedown', () => isDragging = true);
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', (e) => {
        if(isDragging) {
            mouseX += e.movementX;
            mouseY += e.movementY;
        }
    });

    draw();
</script>
</body>
</html>
