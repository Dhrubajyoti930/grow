<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Navier-Stokes Viz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; font-family: 'Inter', sans-serif; color: #e0e0e0; }
        canvas { display: block; touch-action: none; cursor: crosshair; }
        .ui { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 10; }
        a { color: #666; text-decoration: none; font-size: 12px; letter-spacing: 1px; transition: color 0.3s; pointer-events: auto; }
        a:hover { color: #fff; }
        h1 { font-weight: 300; font-size: 18px; margin: 10px 0 0 0; letter-spacing: 2px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="ui">
        <a href="../index.html">← /grow</a>
        <h1>Navier-Stokes Viz</h1>
    </div>
    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let width, height, fluid;

        const res = 60;
        const dt = 0.2;
        const diff = 0.0001;
        const visc = 0.0001;

        class Fluid {
            constructor(size) {
                this.size = size;
                this.dt = dt; this.diff = diff; this.visc = visc;
                this.s = new Float32Array(size * size);
                this.density = new Float32Array(size * size);
                this.Vx = new Float32Array(size * size);
                this.Vy = new Float32Array(size * size);
                this.Vx0 = new Float32Array(size * size);
                this.Vy0 = new Float32Array(size * size);
            }
            step() {
                this.diffuse(1, this.Vx0, this.Vx, this.visc);
                this.diffuse(2, this.Vy0, this.Vy, this.visc);
                this.project(this.Vx0, this.Vy0, this.Vx, this.Vy);
                this.advect(1, this.Vx, this.Vx0, this.Vx0, this.Vy0);
                this.advect(2, this.Vy, this.Vy0, this.Vx0, this.Vy0);
                this.project(this.Vx, this.Vy, this.Vx0, this.Vy0);
                this.diffuse(0, this.s, this.density, this.diff);
                this.advect(0, this.density, this.s, this.Vx, this.Vy);
            }
            addDensity(x, y, amount) { this.density[(x + y * this.size)] += amount; }
            addVelocity(x, y, amountX, amountY) {
                let idx = x + y * this.size;
                this.Vx[idx] += amountX; this.Vy[idx] += amountY;
            }
            diffuse(b, x, x0, diff) {
                let a = this.dt * diff * (this.size - 2) * (this.size - 2);
                for (let k = 0; k < 16; k++) {
                    for (let i = 1; i < this.size - 1; i++) {
                        for (let j = 1; j < this.size - 1; j++) {
                            x[i + j * this.size] = (x0[i + j * this.size] + a * (x[i - 1 + j * this.size] + x[i + 1 + j * this.size] + x[i + (j - 1) * this.size] + x[i + (j + 1) * this.size])) / (1 + 4 * a);
                        }
                    }
                }
            }
            project(vx, vy, p, div) {
                for (let i = 1; i < this.size - 1; i++) {
                    for (let j = 1; j < this.size - 1; j++) {
                        div[i + j * this.size] = -0.5 * (vx[i + 1 + j * this.size] - vx[i - 1 + j * this.size] + vy[i + (j + 1) * this.size] - vy[i + (j - 1) * this.size]) / this.size;
                        p[i + j * this.size] = 0;
                    }
                }
                for (let k = 0; k < 16; k++) {
                    for (let i = 1; i < this.size - 1; i++) {
                        for (let j = 1; j < this.size - 1; j++) {
                            p[i + j * this.size] = (div[i + j * this.size] + p[i - 1 + j * this.size] + p[i + 1 + j * this.size] + p[i + (j - 1) * this.size] + p[i + (j + 1) * this.size]) / 4;
                        }
                    }
                }
                for (let i = 1; i < this.size - 1; i++) {
                    for (let j = 1; j < this.size - 1; j++) {
                        vx[i + j * this.size] -= 0.5 * (p[i + 1 + j * this.size] - p[i - 1 + j * this.size]) * this.size;
                        vy[i + j * this.size] -= 0.5 * (p[i + (j + 1) * this.size] - p[i + (j - 1) * this.size]) * this.size;
                    }
                }
            }
            advect(b, d, d0, vx, vy) {
                let dtx = this.dt * (this.size - 2);
                let dty = this.dt * (this.size - 2);
                for (let i = 1; i < this.size - 1; i++) {
                    for (let j = 1; j < this.size - 1; j++) {
                        let tmp1 = i - dtx * vx[i + j * this.size];
                        let tmp2 = j - dty * vy[i + j * this.size];
                        let i0 = Math.max(0, Math.min(this.size - 2, Math.floor(tmp1)));
                        let i1 = i0 + 1;
                        let j0 = Math.max(0, Math.min(this.size - 2, Math.floor(tmp2)));
                        let j1 = j0 + 1;
                        d[i + j * this.size] = (i1 - tmp1) * ((j1 - tmp2) * d0[i0 + j0 * this.size] + (tmp2 - j0) * d0[i0 + j1 * this.size]) + (tmp1 - i0) * ((j1 - tmp2) * d0[i1 + j0 * this.size] + (tmp2 - j0) * d0[i1 + j1 * this.size]);
                    }
                }
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();
        fluid = new Fluid(res);

        let mouse = { x: 0, y: 0, px: 0, py: 0 };
        window.addEventListener('mousemove', e => {
            mouse.x = Math.floor((e.clientX / width) * res);
            mouse.y = Math.floor((e.clientY / height) * res);
            fluid.addDensity(mouse.x, mouse.y, 100);
            fluid.addVelocity(mouse.x, mouse.y, (e.clientX - mouse.px) * 0.1, (e.clientY - mouse.py) * 0.1);
            mouse.px = e.clientX; mouse.py = e.clientY;
        });

        function animate() {
            fluid.step();
            ctx.fillStyle = '#0a0a0c';
            ctx.fillRect(0, 0, width, height);
            let cellW = width / res;
            let cellH = height / res;
            for (let i = 0; i < res; i++) {
                for (let j = 0; j < res; j++) {
                    let d = fluid.density[i + j * res];
                    if (d > 0.1) {
                        ctx.fillStyle = `rgba(100, 200, 255, ${Math.min(d, 1)})`;
                        ctx.fillRect(i * cellW, j * cellH, cellW, cellH);
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
