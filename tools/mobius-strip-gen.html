<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobius Strip Gen</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0c; --accent: #00f2ff; --text: #e0e0e0; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .ui { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(20, 20, 25, 0.8); padding: 20px; border-radius: 12px; backdrop-filter: blur(10px); border: 1px solid #333; width: 80%; max-width: 400px; }
        .back-link { position: absolute; top: 20px; left: 20px; color: var(--accent); text-decoration: none; font-size: 14px; opacity: 0.7; }
        .back-link:hover { opacity: 1; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: var(--accent); }
        h1 { margin: 0 0 10px 0; font-size: 18px; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); }
        .label { font-size: 12px; margin-bottom: 5px; opacity: 0.8; }
    </style>
</head>
<body>

<a href="../index.html" class="back-link">← /grow</a>

<div id="canvas-container">
    <canvas id="canvas"></canvas>
</div>

<div class="ui">
    <h1>Mobius Strip Gen</h1>
    <div class="label">Twist Factor</div>
    <input type="range" id="twist" min="0.5" max="4" step="0.1" value="1">
    <div class="label" style="margin-top:15px">Resolution</div>
    <input type="range" id="res" min="50" max="300" step="10" value="150">
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const twistInput = document.getElementById('twist');
    const resInput = document.getElementById('res');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const twist = parseFloat(twistInput.value);
        const segments = parseInt(resInput.value);
        const radius = Math.min(canvas.width, canvas.height) * 0.25;
        const width = 40;

        ctx.strokeStyle = '#00f2ff';
        ctx.lineWidth = 1.5;

        for (let i = 0; i < segments; i++) {
            const t = (i / segments) * Math.PI * 2;
            const nextT = ((i + 1) / segments) * Math.PI * 2;

            function getPoint(angle, offset) {
                const x = (radius + offset * Math.cos(angle * twist / 2)) * Math.cos(angle);
                const y = (radius + offset * Math.cos(angle * twist / 2)) * Math.sin(angle);
                return [centerX + x, centerY + y];
            }

            const p1 = getPoint(t, -width);
            const p2 = getPoint(t, width);
            const p3 = getPoint(nextT, width);
            const p4 = getPoint(nextT, -width);

            ctx.beginPath();
            ctx.moveTo(p1[0], p1[1]);
            ctx.lineTo(p2[0], p2[1]);
            ctx.lineTo(p3[0], p3[1]);
            ctx.lineTo(p4[0], p4[1]);
            ctx.closePath();
            ctx.stroke();
            ctx.fillStyle = `rgba(0, 242, 255, ${0.05 + (i/segments)*0.1})`;
            ctx.fill();
        }
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
