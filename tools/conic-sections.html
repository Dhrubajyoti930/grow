<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conic Sections</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0c; --accent: #00f2ff; --text: #e0e0e0; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; overflow: hidden; }
        #back { position: absolute; top: 20px; left: 20px; z-index: 10; color: var(--accent); text-decoration: none; font-size: 14px; letter-spacing: 2px; }
        #controls { position: absolute; bottom: 30px; left: 20px; z-index: 10; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 8px; backdrop-filter: blur(10px); border: 1px solid #333; }
        input[type=range] { width: 150px; accent-color: var(--accent); cursor: pointer; }
        canvas { display: block; width: 100vw; height: 100vh; }
        h1 { position: absolute; top: 20px; right: 20px; font-weight: 300; font-size: 18px; letter-spacing: 4px; color: #555; }
    </style>
</head>
<body>
    <a id="back" href="../index.html">← /grow</a>
    <h1>CONIC SECTIONS</h1>
    <div id="controls">
        <label>Tilt Angle: <input type="range" id="tilt" min="0" max="180" value="90"></label>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const tiltInput = document.getElementById('tilt');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const angle = (tiltInput.value - 90) * Math.PI / 180;
            
            // Draw Cone
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy - 200); ctx.lineTo(cx - 100, cy + 200);
            ctx.moveTo(cx, cy - 200); ctx.lineTo(cx + 100, cy + 200);
            ctx.moveTo(cx, cy + 200); ctx.lineTo(cx - 100, cy - 200);
            ctx.moveTo(cx, cy + 200); ctx.lineTo(cx + 100, cy - 200);
            ctx.stroke();

            // Draw Section
            ctx.strokeStyle = '#00f2ff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00f2ff';
            ctx.beginPath();
            
            const amplitude = 80;
            for(let i = -100; i <= 100; i++) {
                let x = i;
                let y = Math.tan(angle) * i;
                let drawX = cx + x;
                let drawY = cy + y;
                if(i === -100) ctx.moveTo(drawX, drawY);
                else ctx.lineTo(drawX, drawY);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;
            
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
