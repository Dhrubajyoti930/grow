<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cellular Automata | Rule 30</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --panel: #141418;
            --accent: #00f2ff;
            --text: #e0e0e6;
        }
        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        #nav {
            position: absolute;
            top: 20px;
            left: 20px;
        }
        a { color: var(--accent); text-decoration: none; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; }
        header { margin-top: 60px; text-align: center; }
        h1 { font-weight: 300; letter-spacing: 2px; margin-bottom: 0.5rem; }
        .controls { margin: 20px; padding: 20px; background: var(--panel); border-radius: 8px; display: flex; gap: 15px; align-items: center; }
        #canvas-container { background: #000; padding: 10px; border: 1px solid #333; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        canvas { image-rendering: pixelated; display: block; max-width: 90vw; }
        button { 
            background: transparent; border: 1px solid var(--accent); color: var(--accent); 
            padding: 8px 16px; cursor: pointer; font-family: 'JetBrains Mono'; transition: 0.3s;
        }
        button:hover { background: var(--accent); color: #000; }
    </style>
</head>
<body>

<div id="nav"><a href="../index.html">← /grow</a></div>

<header>
    <h1>RULE 30</h1>
    <p style="opacity: 0.6; font-size: 0.8rem;">CHAOS FROM SIMPLE RULES</p>
</header>

<div class="controls">
    <button onclick="generate()">Regenerate</button>
</div>

<div id="canvas-container">
    <canvas id="caCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('caCanvas');
    const ctx = canvas.getContext('2d');
    
    function generate() {
        const width = 200;
        const height = 150;
        const cellSize = 4;
        
        canvas.width = width * cellSize;
        canvas.height = height * cellSize;
        
        let cells = new Array(width).fill(0);
        cells[Math.floor(width / 2)] = 1;
        
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                if (cells[x]) {
                    ctx.fillStyle = '#00f2ff';
                    ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
                }
            }
            
            let next = new Array(width);
            for (let x = 0; x < width; x++) {
                let left = cells[(x - 1 + width) % width];
                let middle = cells[x];
                let right = cells[(x + 1) % width];
                
                // Rule 30 logic
                next[x] = (left ^ (middle | right)) ? 1 : 0;
            }
            cells = next;
        }
    }
    
    generate();
</script>

</body>
</html>
