<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normal Dist Board</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0c; --accent: #00f2ff; --text: #e0e0e0; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; height: 100vh; }
        #nav { position: absolute; top: 20px; left: 20px; z-index: 10; }
        a { color: var(--accent); text-decoration: none; font-size: 0.9rem; opacity: 0.7; transition: 0.3s; }
        a:hover { opacity: 1; }
        canvas { touch-action: none; cursor: crosshair; }
        .ui { position: absolute; bottom: 30px; text-align: center; pointer-events: none; }
        h1 { font-weight: 300; letter-spacing: 2px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div id="nav"><a href="../index.html">← /grow</a></div>
    
    <div class="ui">
        <h1>NORMAL DIST BOARD</h1>
        <p>tap screen to release</p>
    </div>

    <canvas id="board"></canvas>

    <script>
        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        let width, height;
        const pegs = [];
        const balls = [];
        const rows = 12;
        const cols = 13;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initPegs();
        }

        function initPegs() {
            pegs.length = 0;
            const centerX = width / 2;
            const startY = height * 0.2;
            const spacing = 40;
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j <= i; j++) {
                    pegs.push({
                        x: centerX - (i * spacing / 2) + (j * spacing),
                        y: startY + i * spacing
                    });
                }
            }
        }

        class Ball {
            constructor(x) {
                this.x = x;
                this.y = 50;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = 2;
                this.radius = 5;
            }
            update() {
                this.vy += 0.15;
                this.x += this.vx;
                this.y += this.vy;
                
                pegs.forEach(p => {
                    const dx = this.x - p.x;
                    const dy = this.y - p.y;
                    if (Math.sqrt(dx*dx + dy*dy) < 10) {
                        this.vx = (Math.random() - 0.5) * 4;
                        this.vy = -Math.abs(this.vy) * 0.3;
                    }
                });
            }
            draw() {
                ctx.fillStyle = '#00f2ff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 12, 0.2)';
            ctx.fillRect(0, 0, width, height);
            
            ctx.fillStyle = '#333';
            pegs.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            for (let i = balls.length - 1; i >= 0; i--) {
                balls[i].update();
                balls[i].draw();
                if (balls[i].y > height) balls.splice(i, 1);
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('mousedown', (e) => {
            for(let i=0; i<3; i++) balls.push(new Ball(e.clientX + (Math.random()-0.5)*20));
        });

        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
